# Diagnostic run 2 for the branch `diag-masks` only (never merged). Round 1 showed the `gpu_masks` failures depend on the
# machine (probably its CPU, because llvmpipe compiles shaders for the host). Eight jobs land on different CPUs; each prints
# the CPU, builds the test binary at four commits, runs each three times, and runs HEAD three more times with
# LP_NATIVE_VECTOR_WIDTH=128. Every job ends green so the summary line and the failing outputs are uploaded.
name: Diag masks

on:
  push:
    branches: [diag-masks]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      YM_REQUIRE_GPU: "1"
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mesa lavapipe (software Vulkan)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
      - name: CPU and adapter
        run: |
          mkdir -p diag-out
          {
            echo "## lscpu"
            lscpu | grep -a -i -E "model name|vendor|cpu family|^model:|stepping|^CPU\(s\)"
            echo "flags:"
            lscpu | grep -a -i "^flags" | tr ' ' '\n' | grep -a -E "^(avx512.*|fma|f16c|avx2|avx|sse4_2)$" | tr '\n' ' '
            echo
            echo "## vulkaninfo"
            vulkaninfo --summary 2>&1
          } | tee diag-out/cpu.txt
          cat diag-out/cpu.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build gpu_masks at four commits
        run: |
          set +e
          root="$PWD"
          mkdir -p "$root/bins"
          export CARGO_TARGET_DIR="$root/target"
          build() {
            local name="$1" rev="$2" dir
            if [ "$rev" = HEAD ]; then dir="$root"; else
              dir="$root/../wt-$name"
              git worktree add --detach "$dir" "$rev" || return 1
            fi
            ( cd "$dir" && rustup toolchain install >/dev/null 2>&1
              cargo test --release -p ym-gpu --test gpu_masks --no-run 2>&1 | tee "$root/bins/$name.build.log" ) || true
            local bin
            bin=$(sed -n 's/^ *Executable tests\/gpu_masks.rs (\(.*\))$/\1/p' "$root/bins/$name.build.log" | tail -n 1)
            if [ -n "$bin" ] && [ -x "$dir/$bin" ]; then cp "$dir/$bin" "$root/bins/$name"; fi
            echo "$name $rev dir=$dir bin=$bin"
          }
          build HEAD HEAD
          build 0d990cd2 0d990cd2
          build cc161946 cc161946
          build 5cebd5ca 5cebd5ca
          ls -l "$root/bins"
      - name: Run the binaries
        run: |
          set +e
          root="$PWD"
          out="$root/diag-out"
          # Run $1 (name) 3 times; $2 is a label, the rest are env assignments. Prints "failed/3".
          runs() {
            local name="$1" label="$2" failed=0 i dir; shift 2
            if [ "$name" = HEAD ]; then dir="$root"; else dir="$root/../wt-$name"; fi
            if [ ! -x "$root/bins/$name" ]; then echo "nobuild"; return; fi
            for i in 1 2 3; do
              if ( cd "$dir/crates/ym-gpu" && env CARGO_MANIFEST_DIR="$dir/crates/ym-gpu" YELLOWMOON_DATA="$dir/data" "$@" "$root/bins/$name" ) > "$out/$label-$i.log" 2>&1; then
                rm -f "$out/$label-$i.log"
              else
                failed=$((failed + 1))
                grep -a "^test .* FAILED" "$out/$label-$i.log" | sed "s/^/  [$label run $i] /" >> "$out/failing-tests.txt"
              fi
            done
            echo "$failed/3"
          }
          touch "$out/failing-tests.txt"
          r_head=$(runs HEAD head)
          r_0d=$(runs 0d990cd2 0d990cd2)
          r_cc=$(runs cc161946 cc161946)
          r_5c=$(runs 5cebd5ca 5cebd5ca)
          r_vw=$(runs HEAD head-vw128 LP_NATIVE_VECTOR_WIDTH=128)
          cpu=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -n 1)
          line="CPU $cpu | HEAD $r_head | 0d990cd2 $r_0d | cc161946 $r_cc | 5cebd5ca $r_5c | HEAD vw128 $r_vw"
          echo "$line"
          { echo "$line"; echo "failing tests:"; cat "$out/failing-tests.txt"; } > "$out/summary.txt"
          echo "### ${{ matrix.index }}: $line" >> "$GITHUB_STEP_SUMMARY"
          grep -a -h "DIAG" "$out"/head-*.log 2>/dev/null | cut -c1-600 | head -40
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-masks-${{ matrix.index }}
          path: diag-out/
          if-no-files-found: warn
