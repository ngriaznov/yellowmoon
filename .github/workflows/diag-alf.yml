# Round 2: the first round (run 44920123054) showed `fix` (56c4adc1) fails on AMD EPYC 9V45 like the release, main passes, so
# the miscompile is not in how the fold is written alone. Each job now builds and runs the three tests at: main 853e5522, release
# 9363e36a, fix 56c4adc1, V1 86fb0e65 (separate function, called always, one select), V2 7f01340c (separate function inside an
# `if`), V3 46775843 (early return at the top of `node_mask`), V5 1ee29530 (kernel is main's; the host packs Intersect rows as
# subtract rows), and the release again with LP_NATIVE_VECTOR_WIDTH=128 (V4). The failing lines of the first failing run of each
# test are printed in the job log. Round 1 text follows.
# Diagnostic for the branch `diag-alf` only (never merged). CI run 44908112612 (job gpu-lavapipe, commit 9363e36a) failed
# `gpu_alf_look` with a C13 difference of 1.0 on an AMD runner; main 853e5522 had passed. Llvmpipe compiles shaders for the host CPU,
# so each of the eight jobs prints its CPU, builds the three test binaries (gpu_alf_look, gpu_masks, gpu_chain) at three commits
# and runs each three times: main 853e5522, the release 9363e36a, and HEAD of this branch (the fix: the Add fold of `node_mask`
# as in 853e5522, the Intersect products in their own accumulators, one select at the end). Every job ends green; the summary
# line per CPU and the failing outputs are uploaded.
name: Diag alf

on:
  push:
    branches: [diag-alf]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        index: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      YM_REQUIRE_GPU: "1"
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Mesa lavapipe (software Vulkan)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
      - name: CPU and adapter
        run: |
          mkdir -p diag-out
          {
            echo "## lscpu"
            lscpu | grep -a -i -E "model name|vendor|cpu family|^model:|stepping|^CPU\(s\)"
            echo "flags:"
            lscpu | grep -a -i "^flags" | tr ' ' '\n' | grep -a -E "^(avx512.*|fma|f16c|avx2|avx|sse4_2)$" | tr '\n' ' '
            echo
            echo "## vulkaninfo"
            vulkaninfo --summary 2>&1
          } | tee diag-out/cpu.txt
          cat diag-out/cpu.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Build the three test binaries at main, the release and the fix
        run: |
          set +e
          root="$PWD"
          mkdir -p "$root/bins" "$root/diag-out"
          export CARGO_TARGET_DIR="$root/target"
          # "exe NAME" prints the executable of test target NAME from cargo's JSON; "errors" prints rendered compiler errors.
          cat > "$RUNNER_TEMP/cargo_json.py" <<'PY'
          import json, sys
          mode = sys.argv[1]
          want = sys.argv[2] if len(sys.argv) > 2 else ""
          exe = None
          for line in sys.stdin:
              try:
                  m = json.loads(line)
              except ValueError:
                  continue
              if mode == "exe" and m.get("reason") == "compiler-artifact" and m.get("target", {}).get("name") == want and m.get("executable"):
                  exe = m["executable"]
              if mode == "errors" and m.get("reason") == "compiler-message" and m.get("message", {}).get("level") == "error":
                  print(m["message"].get("rendered", ""))
          if mode == "exe" and exe:
              print(exe)
          PY
          fail() {
            local name="$1" why="$2"
            {
              echo "BUILD FAILED $name: $why"
              { cat "$root/bins/$name.worktree.log" "$root/bins/$name.build.log" "$root/bins/$name.errors.log"; } 2>/dev/null | tail -n 40
            } | tee -a "$root/diag-out/build-failures.txt" >> "$GITHUB_STEP_SUMMARY"
          }
          build() {
            local name="$1" rev="$2" dir bin t
            : > "$root/bins/$name.worktree.log"
            if [ "$rev" = HEAD ]; then dir="$root"; else
              dir="$root/../wt-$name"
              if ! git worktree add --detach "$dir" "$rev" > "$root/bins/$name.worktree.log" 2>&1; then
                fail "$name" "git worktree add failed"; return 1
              fi
            fi
            ( cd "$dir" && rustup toolchain install > "$root/bins/$name.toolchain.log" 2>&1
              cargo test --release -p ym-gpu --test gpu_alf_look --test gpu_masks --test gpu_chain --no-run --message-format=json \
                > "$root/bins/$name.build.json" 2> "$root/bins/$name.build.log"
              echo "cargo exit: $?" >> "$root/bins/$name.build.log" )
            python3 -I "$RUNNER_TEMP/cargo_json.py" errors < "$root/bins/$name.build.json" > "$root/bins/$name.errors.log"
            for t in gpu_alf_look gpu_masks gpu_chain; do
              bin=$(python3 -I "$RUNNER_TEMP/cargo_json.py" exe "$t" < "$root/bins/$name.build.json" | tail -n 1)
              if [ -n "$bin" ] && [ -f "$bin" ]; then
                cp "$bin" "$root/bins/$name-$t" && chmod +x "$root/bins/$name-$t"
              else
                fail "$name" "no $t executable in cargo JSON"
              fi
            done
          }
          build main 853e5522
          build release 9363e36a
          build fix 56c4adc1
          build v1 86fb0e65
          build v2 7f01340c
          build v3 46775843
          build v5 1ee29530
          ls -l "$root/bins"
      - name: Run the binaries
        run: |
          set +e
          root="$PWD"
          out="$root/diag-out"
          # runs NAME TEST: three runs of one binary; prints "failed/3".
          runs() {
            local name="$1" t="$2" label="$3" failed=0 i dir
            shift 3
            [ -n "$label" ] || label="$name"
            dir="$root/../wt-$name"
            if [ ! -x "$root/bins/$name-$t" ]; then echo "nobuild"; return; fi
            for i in 1 2 3; do
              if ( cd "$dir/crates/ym-gpu" && env CARGO_MANIFEST_DIR="$dir/crates/ym-gpu" YELLOWMOON_DATA="$dir/data" "$@" "$root/bins/$name-$t" ) > "$out/$label-$t-$i.log" 2>&1; then
                rm -f "$out/$label-$t-$i.log"
              else
                failed=$((failed + 1))
                grep -a -E "^test .* FAILED|panicked|\|GPU - CPU\||mismatch|differ|left:|right:" "$out/$label-$t-$i.log" | cut -c1-300 | sed "s/^/  [$label $t run $i] /" >> "$out/failing-tests.txt"
                if [ "$i" = 1 ]; then
                  { echo "::group::$label $t run 1 (failed): last 60 lines"
                    tail -n 60 "$out/$label-$t-$i.log" | cut -c1-400
                    echo "::endgroup::"; } >&2
                fi
              fi
            done
            echo "$failed/3"
          }
          touch "$out/failing-tests.txt"
          cpu=$(lscpu | sed -n 's/^Model name:[[:space:]]*//p' | head -n 1)
          line="CPU $cpu"
          for name in main release fix v1 v2 v3 v5 release_lp128; do
            line="$line | $name:"
            for t in gpu_alf_look gpu_masks gpu_chain; do
              if [ "$name" = release_lp128 ]; then
                r=$(runs release $t release_lp128 LP_NATIVE_VECTOR_WIDTH=128)
              else
                r=$(runs $name $t "")
              fi
              line="$line $t $r"
            done
          done
          echo "$line"
          { echo "$line"; echo "failing tests:"; cat "$out/failing-tests.txt"; cat "$out/build-failures.txt" 2>/dev/null; } > "$out/summary.txt"
          echo "### ${{ matrix.index }}: $line" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diag-alf-${{ matrix.index }}
          path: |
            diag-out/
            bins/*.log
          if-no-files-found: warn
