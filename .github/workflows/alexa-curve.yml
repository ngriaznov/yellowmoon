# ALEXA curve validation (M1-03): leave-one-camera-out over the 52 rawtoaces-data cameras,
# compared with the published numbers (median RFSE 2.2 %, emulation dE00 median 0.23, +/-0.1).
# Runs when the curve pipeline or the shipped curve changes, nightly, and on demand.
# Sources are fetched by tools/fetch/spectral.sh at pinned commits; nothing is committed.
name: alexa-curve

on:
  push:
    branches: [main]
    paths:
      - "training/alexa/**"
      - "training/common/**"
      - "training/requirements.txt"
      - "data/alexa/**"
      - "data/arri/**"
      - "tools/fetch/spectral.sh"
      - ".github/workflows/alexa-curve.yml"
  pull_request:
    paths:
      - "training/alexa/**"
      - "training/common/**"
      - "training/requirements.txt"
      - "data/alexa/**"
      - "data/arri/**"
      - "tools/fetch/spectral.sh"
      - ".github/workflows/alexa-curve.yml"
  schedule:
    - cron: "41 3 * * *"   # nightly
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loo:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: training/requirements.txt
      - run: pip install -r training/requirements.txt
      - name: Cache fetched spectral sources
        uses: actions/cache@v4
        with:
          path: testdata/sources
          key: spectral-sources-${{ hashFiles('tools/fetch/spectral.sh') }}
      - run: tools/fetch/spectral.sh
      - name: Leave-one-camera-out validation
        run: python3 -m training.alexa.validate_loo --jobs 4
      - name: Compare with the published numbers
        run: python3 -m training.alexa.check_loo
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: loo-results
          path: testdata/out/alexa/loo_results.csv
          if-no-files-found: ignore
