# Update check: installs a published release on a Mac runner, launches it and captures the screen, to see what its
# updater does against the latest release (docs/12 §In the app). By hand only (Actions > Update check > Run workflow).
# The screenshots and the app's log are the artefact "update-check-<version>".
name: Update check

on:
  workflow_dispatch:
    inputs:
      version:
        description: "The installed version, as released (for example 0.1.0)"
        type: string
        default: "0.1.0"

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 20
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Install the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p check apps
          gh release download "v${VERSION}" --repo "$GITHUB_REPOSITORY" --pattern "Yellowmoon_${VERSION}_universal.dmg" --dir check
          hdiutil attach -nobrowse -mountpoint "$RUNNER_TEMP/dmg" "check/Yellowmoon_${VERSION}_universal.dmg"
          cp -R "$RUNNER_TEMP/dmg/Yellowmoon.app" apps/
          hdiutil detach "$RUNNER_TEMP/dmg"
          xattr -dr com.apple.quarantine apps/Yellowmoon.app || true
          defaults read "$PWD/apps/Yellowmoon.app/Contents/Info.plist" CFBundleShortVersionString

      - name: Launch it and capture the screen
        run: |
          open "$PWD/apps/Yellowmoon.app"
          sleep 8
          screencapture -x check/screen-8s.png || true
          # The quiet update check runs 10 s after launch.
          sleep 22
          screencapture -x check/screen-30s.png || true
          sleep 30
          screencapture -x check/screen-60s.png || true
          osascript -e 'quit app "Yellowmoon"' || true
          sleep 3
          find "$HOME/Library" -path "*yellowmoon*" -name "*.log" 2>/dev/null | while read -r f; do cp "$f" "check/$(basename "$f")"; done
          defaults read "$PWD/apps/Yellowmoon.app/Contents/Info.plist" CFBundleShortVersionString | tee check/version-after.txt

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: update-check-${{ inputs.version }}
          path: check/*.png
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: update-check-${{ inputs.version }}-logs
          path: |
            check/*.log
            check/version-after.txt
          if-no-files-found: ignore
          retention-days: 14
