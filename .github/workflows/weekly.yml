# Weekly checks: wall-clock measurements that don't belong in a push on a runner shared with other jobs.
# Started on Monday mornings (UTC) or by hand from the Actions tab.
name: Weekly

on:
  schedule:
    - cron: "43 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  # M3-03 (docs/11 "Large folders", docs/13): the 500-photo latency, weekly because a wall-clock bound does not belong in a push on
  # a runner shared with other jobs. Two halves, each a report with one generous bound; the numbers are in the job summary and in
  # the artifacts, and the trend is what to read.
  #  - The shell's half: the ignored Rust test `five_hundred_files_leave_the_commands_responsive` opens 500 synthetic photos and times
  #    the commands a person sends while they develop (asserts 100 ms). It opens no window and starts no Tauri runtime, so there is
  #    no X server (xvfb) here, as in the `parity` job; the Tauri libraries are only there to link the app crate.
  #  - The web view's half: e2e/perf drives the production build on the mock with 500 photos developing and presses keys meanwhile
  #    (asserts p95 < 150 ms; docs/11 has the figures of the run it replaced). The Mac, Metal and the real window stay M3-H4.
  latency-500:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system libraries (the app crate is built here; no window is opened)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: ym, built by itself (also the app's sidecar)
        run: tools/dev/prepare-sidecar.sh
      # Node and Chromium are set up before either half runs, and the web view's half has `if: ${{ !cancelled() }}`: a shell half that
      # is over its bound (or does not build) must not hide the other half's numbers, which is what a failed step does by default.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Shell side, 500 photos (the ignored test)
        shell: bash
        run: |
          code=0
          cargo test -p yellowmoon-app --bin yellowmoon-app five_hundred -- --ignored --nocapture 2>&1 | tee latency-core.txt || code=$?
          { echo '### Shell side, 500 photos developing (the ignored test of src-tauri)'; echo '```text'; grep -E 'open_paths:|developed after|photo_progress events|test result:' latency-core.txt || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - name: Web view side, 500 photos on the mock (production build)
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          code=0
          e2e/perf/run.sh || code=$?
          if [ -f test-results/perf/latency.md ]; then cat test-results/perf/latency.md >> "$GITHUB_STEP_SUMMARY"; fi
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: latency-500
          path: |
            latency-core.txt
            test-results/perf/latency.json
            test-results/perf/latency.md
          if-no-files-found: ignore
