# The learned Auto crop pilot on Modal (training/crop/README.md). Modal's client speaks gRPC, which the agents' cloud
# proxy does not carry, so the pilot starts from here: a push to the branch `crop-pilot-run` runs it with PILOT_ARGS.
# Needs the repository secrets MODAL_TOKEN_ID and MODAL_TOKEN_SECRET.
#
# Budget: the owner's Modal account holds $30 (2026-10-23), and nothing may go past it without their permission.
# `--budget` caps the run's own spend estimate well below that (training/crop/budget.py); the job runs `modal run`
# without --detach, so cancelling this job stops the app on Modal too.
#
# The results (student weights, metrics, FrameLite's labels, the log) go to the temporary branch `crop-pilot-runs`
# and to an artifact; never to main.
name: crop-pilot

on:
  push:
    branches: [crop-pilot-run]

permissions:
  contents: write

concurrency:
  group: crop-pilot
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      # Read under other names: the step "Modal tokens" strips stray whitespace (a pasted secret can end in a newline;
      # Modal's tokens never contain whitespace) and exports the clean values as MODAL_TOKEN_ID and MODAL_TOKEN_SECRET.
      SECRET_MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      SECRET_MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      # ENTRY is the modal_app entrypoint: `pilot` (label, then train), `train_labelled` (train on the labels already
      # on the volume, label nothing) or `improve` (stage A: pretraining on Open Images' boxes, the bins head and a
      # learning curve; labels nothing). Every change here needs the owner's yes first: their Modal limit is $30
      # (2026-10-23: "We can use remaining 13$ if this improves our model").
      # `results` only lists the runs' metrics (one small CPU call); the fetch step below copies the files.
      ENTRY: results
      PILOT_ARGS: ""
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install modal==1.6.2 numpy==2.2.6 pillow==12.2.0
      - name: Modal tokens
        shell: bash
        run: |
          id="$(printf '%s' "$SECRET_MODAL_TOKEN_ID" | tr -d '[:space:]')"
          secret="$(printf '%s' "$SECRET_MODAL_TOKEN_SECRET" | tr -d '[:space:]')"
          test -n "$id" && test -n "$secret"
          echo "::add-mask::$id"
          echo "::add-mask::$secret"
          echo "MODAL_TOKEN_ID=$id" >> "$GITHUB_ENV"
          echo "MODAL_TOKEN_SECRET=$secret" >> "$GITHUB_ENV"
      # The log and the results are written outside the checkout while Modal runs: Modal uploads the `training`
      # package when an app starts and fails if a file under it changes meanwhile.
      - name: Pilot
        shell: bash
        run: modal run -m training.crop.modal_app::$ENTRY $PILOT_ARGS 2>&1 | tee "$RUNNER_TEMP/pilot.log"
      - name: Fetch the results from the volume
        if: always()
        run: modal run -m training.crop.modal_app::fetch --dest "$RUNNER_TEMP/runs"
      - name: Push the results to crop-pilot-runs
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p training/crop/runs
          cp -r "$RUNNER_TEMP/runs/." training/crop/runs/ 2>/dev/null || true
          cp "$RUNNER_TEMP/pilot.log" training/crop/runs/ 2>/dev/null || true
          git checkout -B crop-pilot-runs
          git add -f training/crop/runs
          git diff --cached --quiet && exit 0
          git commit -q -m "Crop pilot results (temporary branch)" \
            -m "From the crop-pilot workflow, run ${GITHUB_RUN_ID}."
          git push -f origin crop-pilot-runs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crop-pilot
          path: training/crop/runs
          retention-days: 14
