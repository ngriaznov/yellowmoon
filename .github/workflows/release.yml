# Release: every version bump on main becomes a GitHub release with the universal disk image (docs/12).
# Adapted from github.com/ngriaznov/plugout. Installed in M0-03.
#
# The version is the root Cargo.toml [workspace.package] version (set with tools/release/bump-version.sh; 0.1.x
# while the app is tested); a push whose version already has a tag releases nothing. The release notes are that
# version's section of CHANGELOG.md. The app has no Apple Developer ID (docs/16): the bundle is signed ad hoc and
# the README says how to allow it to open.
#
# Every release carries everything the in-app updater needs: the disk image for people, and for the updater the
# Yellowmoon.app.tar.gz, its minisign signature (inside latest.json) and latest.json for darwin-aarch64 and
# darwin-x86_64. That needs the updater signing setup: the repository secret TAURI_SIGNING_PRIVATE_KEY (and
# TAURI_SIGNING_PRIVATE_KEY_PASSWORD when the key has a password; plugout's key has none, and GitHub cannot store an
# empty secret), and the public key in src-tauri/tauri.conf.json (plugins.updater.pubkey);
# steps in docs/release-signing.md. Without it the job stops before building, because a version built without the
# public key could never update itself afterwards.
name: Release

on:
  push:
    branches: [main]
  # Retry a release whose run failed (the tag is made only by a successful publish).
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # The macOS 27 SDK, which Apple Auto's Swift bridge needs (docs/19 section 11), is only on GitHub's xcode-27 image
    # (macOS 27, Apple silicon). The x86_64 half of the universal binary gets the bridge's stub. A test build of the
    # universal app there passed on 2026-10-19 (build.yml run 39251110009).
    runs-on: xcode-27
    timeout-minutes: 120
    env:
      # macOS 27's dyld refuses the proc-macro dylibs that Rust 1.97 builds in release with Cargo's default strip
      # ("mis-aligned LINKEDIT string pool"; apple-bridge.yml shows it at every run), so nothing is stripped on this image.
      CARGO_PROFILE_RELEASE_STRIP: "none"
      CARGO_PROFILE_RELEASE_BUILD_OVERRIDE_STRIP: "none"
      # The app's minimumSystemVersion, for every binary: the sidecar ym is built by cargo, which would otherwise
      # link it for rustc's default macOS 11.0 (docs/19 section 11, "The weak link").
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(sed -n '/^\[workspace.package\]/,/^\[/{s/^version = "\(.*\)"/\1/p;}' Cargo.toml | head -n 1)
          if [ -z "$VERSION" ]; then
            echo "::error title=No version::Cargo.toml has no [workspace.package] version"
            exit 1
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check_tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v${{ steps.version.outputs.version }} is already released; bump the version to release (tools/release/bump-version.sh)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Require the updater signing setup
        if: steps.check_tag.outputs.exists == 'false'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error title=Signing key missing::Set TAURI_SIGNING_PRIVATE_KEY as a repository secret, and TAURI_SIGNING_PRIVATE_KEY_PASSWORD if the key has a password (docs/release-signing.md). A release without it could not update itself."
            exit 1
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]; then
            echo "No TAURI_SIGNING_PRIVATE_KEY_PASSWORD secret: the key is used without a password."
          fi
          if grep -q 'REPLACE_WITH_MINISIGN_PUBLIC_KEY' src-tauri/tauri.conf.json; then
            echo "::error title=Updater public key missing::Put the minisign public key into src-tauri/tauri.conf.json plugins.updater.pubkey (docs/release-signing.md)."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable
        if: steps.check_tag.outputs.exists == 'false'
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Add both macOS targets to the pinned toolchain
        if: steps.check_tag.outputs.exists == 'false'
        # rust-toolchain.toml pins the version, which overrides the toolchain installed above.
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: actions/setup-node@v4
        if: steps.check_tag.outputs.exists == 'false'
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@v2
        if: steps.check_tag.outputs.exists == 'false'
        with:
          # The same cache as the universal test build (build.yml).
          shared-key: build-macos-universal

      - name: Install frontend dependencies
        if: steps.check_tag.outputs.exists == 'false'
        run: npm ci

      # NOTICE item 9 and the About dialog promise the licence texts of every dependency, and a binary release must carry them.
      # The generator reads Cargo.lock and the npm package folders (hence after `npm ci`), fails when a package has no text, and
      # check_bundle.py fails when src-tauri/tauri.conf.json would not put the file (and NOTICE with the BSD conditions) into the
      # bundle. The CI job `licences` runs the same two commands on every change. tools/licences/README.md.
      - name: cargo-about
        if: steps.check_tag.outputs.exists == 'false'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - name: Licence texts of the dependencies (THIRD-PARTY.md, bundled next to NOTICE)
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          python3 tools/licences/generate.py
          python3 tools/licences/check_bundle.py

      - name: Release notes (the version's section of CHANGELOG.md)
        if: steps.check_tag.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::warning title=No CHANGELOG section::CHANGELOG.md has no \"## [$VERSION]\" section."
            echo "Yellowmoon $VERSION." > "$RUNNER_TEMP/notes.md"
          fi
          {
            echo
            echo "### Install"
            echo
            echo "Download \`Yellowmoon_${VERSION}_universal.dmg\` below, open it and drag Yellowmoon to Applications."
            echo "Yellowmoon is not signed with an Apple Developer ID, so macOS asks once before it opens it:"
            echo "see [Allow Yellowmoon to open](https://github.com/${GITHUB_REPOSITORY}#allow-yellowmoon-to-open)."
          } >> "$RUNNER_TEMP/notes.md"

      - name: Build the command-line tool (universal)
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          cargo build -p ym-cli --release --target aarch64-apple-darwin
          cargo build -p ym-cli --release --target x86_64-apple-darwin
          mkdir -p src-tauri/binaries
          # Tauri sidecar naming: <name>-<target triple>. The sidecar is called ym: it is the command, and
          # inside the bundle it is Contents/MacOS/ym, which cannot collide with the app binary "Yellowmoon"
          # on a case-insensitive file system.
          # The universal build runs one cargo build per architecture, and each one's tauri-build checks
          # for its own triple, so place all three.
          cp target/aarch64-apple-darwin/release/ym src-tauri/binaries/ym-aarch64-apple-darwin
          cp target/x86_64-apple-darwin/release/ym src-tauri/binaries/ym-x86_64-apple-darwin
          lipo -create \
            target/aarch64-apple-darwin/release/ym \
            target/x86_64-apple-darwin/release/ym \
            -output src-tauri/binaries/ym-universal-apple-darwin
          lipo -info src-tauri/binaries/ym-universal-apple-darwin

      - name: Build universal macOS bundle (ad-hoc signed, updater tarball signed with the minisign key)
        if: steps.check_tag.outputs.exists == 'false'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # Tauri's bundle_dmg.sh (hdiutil) fails now and then on the hosted runners (0.1.2's first run, 0.1.3's
        # first run: "error running bundle_dmg.sh", the compile itself fine). Up to three tries; between them
        # anything the script left mounted is detached and the half-made image removed. The compile is not
        # repeated (cargo's output is reused), only the bundling. --verbose shows the script's own error.
        run: |
          for attempt in 1 2 3; do
            if npm run tauri build -- --verbose --target universal-apple-darwin \
              --config '{"bundle":{"createUpdaterArtifacts":true,"macOS":{"signingIdentity":"-"}}}'; then
              exit 0
            fi
            echo "::warning title=Bundling failed::try ${attempt} of 3 failed; detaching leftover images and trying again"
            for vol in /Volumes/Yellowmoon* /Volumes/dmg.*; do
              [ -d "$vol" ] && hdiutil detach "$vol" -force || true
            done
            rm -rf target/universal-apple-darwin/release/bundle/dmg
            sleep 20
          done
          exit 1

      - name: Check the bundle
        if: steps.check_tag.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          APP="target/universal-apple-darwin/release/bundle/macos/Yellowmoon.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -info "$APP/Contents/MacOS/Yellowmoon"
          "$APP/Contents/MacOS/ym" --version | tee "$RUNNER_TEMP/ym-version.txt"
          grep -q "^ym ${VERSION} " "$RUNNER_TEMP/ym-version.txt"
          ls target/universal-apple-darwin/release/bundle/dmg/"Yellowmoon_${VERSION}_universal.dmg"
          # The updater's files: the tarball and its signature, both non-empty.
          test -s target/universal-apple-darwin/release/bundle/macos/Yellowmoon.app.tar.gz
          test -s target/universal-apple-darwin/release/bundle/macos/Yellowmoon.app.tar.gz.sig

      - name: Write updater manifest
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          BUNDLE_DIR="target/universal-apple-darwin/release/bundle/macos"
          TARBALL=$(ls "$BUNDLE_DIR"/*.app.tar.gz)
          SIGNATURE=$(cat "$BUNDLE_DIR"/*.app.tar.gz.sig)
          VERSION="${{ steps.version.outputs.version }}"
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/$(basename "$TARBALL")"
          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg url "$URL" \
            --arg signature "$SIGNATURE" \
            '{
              version: $version,
              pub_date: $pub_date,
              platforms: {
                "darwin-aarch64": { url: $url, signature: $signature },
                "darwin-x86_64": { url: $url, signature: $signature }
              }
            }' > latest.json
          cat latest.json
          # Both platforms must carry the signature and the tarball's URL.
          jq -e '[.platforms[] | (.signature | length > 0) and (.url | endswith(".app.tar.gz"))] | all' latest.json

      - name: Publish release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ steps.version.outputs.version }}"
          target_commitish: ${{ github.sha }}
          name: "Yellowmoon ${{ steps.version.outputs.version }}"
          body_path: ${{ runner.temp }}/notes.md
          # The disk image for people; the tarball and latest.json for the in-app updater (its signature is in latest.json,
          # and the .sig is published too). All four must be there.
          fail_on_unmatched_files: true
          files: |
            target/universal-apple-darwin/release/bundle/dmg/*.dmg
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
            latest.json

      - name: Update Homebrew cask
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SHA=$(shasum -a 256 target/universal-apple-darwin/release/bundle/dmg/*.dmg | cut -d' ' -f1)
          git fetch origin main
          git checkout -B main origin/main
          sed -i '' \
            -e "s/^  version \".*\"/  version \"${VERSION}\"/" \
            -e "s/^  sha256 \".*\"/  sha256 \"${SHA}\"/" \
            Casks/yellowmoon.rb
          git config user.name "Nikita Griaznov"
          git config user.email "17167893+ngriaznov@users.noreply.github.com"
          git add Casks/yellowmoon.rb
          git commit -m "Update Homebrew cask to ${VERSION}"
          git push origin main
