# Metal on GitHub's Apple-silicon macOS runners (the owner's GPU direction of 2026-10-13, docs/16; docs/13).
# The hosted runners are virtual machines with Apple's paravirtualised GPU. They check correctness on real Metal:
# the WGSL kernels translated to MSL by naga and compiled by Apple's compiler, Metal's math (fast-math, FMA contraction,
# log2/exp2/pow accuracy), parity of every kernel with its CPU reference, tile = whole frame, run-to-run determinism,
# and that the app (with the native Metal viewport in src-tauri/src/native.rs) builds and its tests pass on macOS.
# They do not measure speed (shared VM, paravirtual GPU) or how the viewport looks on screen: those stay M0-H4 on a
# physical Mac (tools/dev/mac-gpu-check.sh). Runs on every push except checkpoints, on pull requests, and by hand.
#
# G-09 added to the job below: the large tests that are #[ignore]d by default (a 50 MP and a 70 MP frame through the raw front,
# the reduced path, the chain's corner tiles, the export tail and the spike), the encode-split bench (print only), the GPU
# golden subset (`golden check --device gpu`, the device against the CPU of the same machine), one of the owner's photos
# through the same comparison, and the determinism and fault suites (tests/gpu_determinism.rs and tests/gpu_faults.rs run
# with every other ym-core test). The Rust cache: one key for both runners (both are arm64), saved also when a test fails,
# and only from the branches that are worth a cache (a pull request must not push the macOS caches out of the repository's
# 10 GB; a failing run used to save nothing, so the next run found no cache either).
name: Mac GPU (Metal)

on:
  # Every push except checkpoints (the jobs skip those): a path filter missed the commit that closes a wave, whose code
  # had already gone in with earlier checkpoint commits.
  push:
    branches: [main, "claude/**"]
  pull_request:
    paths: ["crates/**", "src-tauri/**", "src/**", "tools/golden/**", "data/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "package.json", "package-lock.json", ".github/workflows/mac-gpu.yml"]
  workflow_dispatch:

permissions:
  contents: read

# One group per commit: a later push never cancels a run that is under way (a run takes about 25 minutes and the
# branch is pushed more often than that), so every pushed commit gets its Metal result.
concurrency:
  group: mac-gpu-${{ github.sha }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

defaults:
  run:
    shell: bash   # bash -eo pipefail: a failing command before `tee` fails the step

jobs:
  metal:
    name: Kernels on Metal (${{ matrix.runner }})
    # Checkpoint commits snapshot work in progress (half-finished lanes) and are not expected to build; skip them.
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Checkpoint') }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-14]   # both Apple silicon (arm64)
    runs-on: ${{ matrix.runner }}
    # The run of 4c5939f took 50 minutes with a warm dependency cache (ym-gpu 16, ym-core 28); the steps G-09 added (the 50 and
    # 70 MP tests, the encode split, the synthetic set and the golden subset, one 50 MP photo twice, the bench) are another
    # 30 to 45 by estimate, and the first run of a new cache key is cold. The numbers of the first runs go to docs/13.
    timeout-minutes: 150
    env:
      WGPU_BACKEND: metal
      # A release build finds data/ only inside an app bundle (docs/01, "Finding data/"); point it at the repository's.
      YELLOWMOON_DATA: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          # One cache for both runners: macos-14 and macos-15 are both arm64 and the same rustc, and two copies of a
          # 3 GB release tree cost the repository's cache budget twice.
          shared-key: metal-arm64
          cache-on-failure: true
          save-if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/') }}
      - name: The machine's GPU as macOS reports it
        run: system_profiler SPDisplaysDataType SPHardwareDataType | tee system-${{ matrix.runner }}.txt
      - name: The adapter as ym sees it (ym doctor)
        run: cargo run -p ym-cli --release -- doctor --json | tee doctor-${{ matrix.runner }}.json
      # YM_REQUIRE_GPU turns "no adapter, skipped" into a failure, so a runner without Metal cannot pass silently.
      - name: Every GPU kernel against its CPU reference on Metal (ym-gpu)
        env:
          YM_REQUIRE_GPU: "1"
        run: cargo test -p ym-gpu --release --no-fail-fast -- --test-threads=2 2>&1 | tee ym-gpu-${{ matrix.runner }}.log
      - name: Device faults and the ML device recipe on Metal (ym-gpu, features fault-injection and ml)
        if: ${{ !cancelled() }}
        env:
          YM_REQUIRE_GPU: "1"
        run: cargo test -p ym-gpu --release --features fault-injection,ml --lib --test gpu_device --test gpu_chain 2>&1 | tee ym-gpu-features-${{ matrix.runner }}.log
      - name: The renderer on Metal (ym-core, every test, determinism and faults included; the GPU ones against the CPU reference)
        if: ${{ !cancelled() }}
        env:
          YM_REQUIRE_GPU: "1"
        run: cargo test -p ym-core --release --features fault-injection --no-fail-fast -- --test-threads=2 2>&1 | tee ym-core-${{ matrix.runner }}.log
      - name: The app and ym give the same exports on Metal (ym-cli parity_gpu)
        if: ${{ !cancelled() }}
        env:
          YM_REQUIRE_GPU: "1"
          YELLOWMOON_GPU: "on"
        run: cargo test -p ym-cli --release --test parity_gpu 2>&1 | tee ym-cli-parity-gpu-${{ matrix.runner }}.log
      # The tests that are #[ignore]d for their size: a 70 MP raw frame through two slabs, 50 MP frames through the reduced path
      # (default slabs, and k = 2 at the design binding), the chain's two 50 MP corner tiles, the export tail's 50 MP picture
      # (two runs, the same bytes), the 50 MP export through the app's path (no host frame, DNG apart) and the spike's 50 MP
      # frame. They are named by what they test, so the other ignored tests (development aids, child-process probes) stay out.
      # One thread: each holds a few hundred MB of device memory and the runner has 7 GB.
      - name: The 50 MP and 70 MP tests (ignored by default) on Metal
        if: ${{ !cancelled() }}
        env:
          YM_REQUIRE_GPU: "1"
        run: |
          cargo test -p ym-gpu --release --test gpu_front --test gpu_reduced --test gpu_chain --test gpu_tail --test gpu_spike -- \
            --ignored --test-threads=1 --nocapture 70_mp 50_mp fifty_megapixels gpu_spike_50mp 2>&1 | tee ym-gpu-large-${{ matrix.runner }}.log
          cargo test -p ym-core --release --features fault-injection --test gpu_export -- \
            --ignored --test-threads=1 --nocapture fifty_megapixels 2>&1 | tee ym-core-large-${{ matrix.runner }}.log
      # The encode split of docs/09 on this machine's CPU encoders (C13, resize, sharpening, DCT and Huffman, LZW, Deflate): print only.
      - name: Encode split (print only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: cargo test -p ym-export --release --test encode_split -- --ignored --nocapture 2>&1 | tee encode-split-${{ matrix.runner }}.log
      # The GPU golden subset (docs/13 "GPU golden"): the synthetic files, each rendered by `ym render --require-gpu` and held
      # against a CPU render of the same run on the same machine (a Mac's CPU path is not the Linux one expected.json describes,
      # so the stored pictures do not apply here: `--reference render`). A render that fell back to the CPU fails.
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Synthetic ARW set (the generator and its requirements)
        if: ${{ !cancelled() }}
        run: |
          pip install -r training/requirements.txt -r training/synth/requirements.txt
          tools/fetch/spectral.sh
          tools/fetch/synthetic.sh --release
      - name: Golden check on Metal (the GPU subset against the CPU of this machine)
        if: ${{ !cancelled() }}
        run: |
          cargo build --release -p ym-cli
          cargo build --release -p golden
          target/release/golden check --device gpu --reference render --subset tools/golden/gpu-subset.txt \
            --ym target/release/ym --require-all --report golden-gpu-${{ matrix.runner }}.json 2>&1 | tee golden-gpu-${{ matrix.runner }}.txt
      # One of the owner's photos (Mykyta allows them in CI, NOTICE item 10): the readme-photos branch, raw files in Git LFS,
      # cached by the checksums of tools/fetch/owner-photos.sha256. The cache holds the files and not the clone's .git
      # (persist-credentials is off, so no token can end up in a cache).
      - name: Owner photos (readme-photos branch, Git LFS)
        if: ${{ !cancelled() }}
        id: owner
        uses: actions/cache@v4
        with:
          path: |
            testdata/readme-photos/src
            !testdata/readme-photos/src/.git
          key: owner-photos-${{ hashFiles('tools/fetch/owner-photos.sha256') }}
      - name: Fetch the owner photos (cache miss)
        if: ${{ !cancelled() && steps.owner.outputs.cache-hit != 'true' }}
        uses: actions/checkout@v4
        with:
          ref: readme-photos
          lfs: true
          path: testdata/readme-photos/src
          persist-credentials: false
      # Not tools/fetch/owner-photos.sh --verify: on a Mac that script falls back to `shasum --quiet`, an option the Digest::SHA that
      # ships with macOS's Perl 5.34 (6.02) probably lacks (newer versions have it), and the runners have no unprefixed sha256sum.
      # Plain `shasum -a 256 -c` works with every version; it lists each file as OK.
      - name: Verify the owner photos
        if: ${{ !cancelled() }}
        run: cd testdata/readme-photos/src && shasum -a 256 -c "$GITHUB_WORKSPACE/tools/fetch/owner-photos.sha256"
      - name: One real photo, the device against the CPU (golden metric)
        if: ${{ !cancelled() }}
        run: |
          target/release/golden device-check --ym target/release/ym --long-edge 1500 \
            --report device-check-${{ matrix.runner }}.json testdata/readme-photos/src/A1M01749.ARW 2>&1 | tee device-check-${{ matrix.runner }}.txt
      # The report of docs/10 `ym doctor --bench` on the same photo, for the record (a shared VM: the numbers are not a speed).
      - name: ym doctor --bench on the device (print only)
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          YELLOWMOON_GPU: require
        run: target/release/ym doctor --bench testdata/readme-photos/src/A1M01749.ARW --repeat 3 2>&1 | tee bench-${{ matrix.runner }}.txt
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metal-${{ matrix.runner }}
          path: |
            system-${{ matrix.runner }}.txt
            doctor-${{ matrix.runner }}.json
            ym-gpu-${{ matrix.runner }}.log
            ym-core-${{ matrix.runner }}.log
            ym-gpu-features-${{ matrix.runner }}.log
            ym-cli-parity-gpu-${{ matrix.runner }}.log
            ym-gpu-large-${{ matrix.runner }}.log
            ym-core-large-${{ matrix.runner }}.log
            encode-split-${{ matrix.runner }}.log
            golden-gpu-${{ matrix.runner }}.json
            golden-gpu-${{ matrix.runner }}.txt
            device-check-${{ matrix.runner }}.json
            device-check-${{ matrix.runner }}.txt
            bench-${{ matrix.runner }}.txt
          if-no-files-found: warn

  app:
    name: App and workspace on macOS
    # Checkpoint commits snapshot work in progress (half-finished lanes) and are not expected to build; skip them.
    if: ${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'Checkpoint') }}
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Frontend build (the app embeds dist/)
        run: npm ci && npm run build
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: app-macos
          cache-on-failure: true
          save-if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/claude/') }}
      - run: tools/dev/prepare-sidecar.sh   # tauri-build needs the sidecar to exist (docs/01)
      - name: Clippy for the macOS-only code (native Metal viewport)
        run: cargo clippy -p yellowmoon-app --all-targets -- -D warnings
      - name: App tests on macOS
        run: cargo test -p yellowmoon-app
