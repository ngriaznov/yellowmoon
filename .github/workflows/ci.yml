# CI: adapted from github.com/ngriaznov/plugout, extended with licence checks, golden images,
# decoder oracles, DNG validation and a training dry run (docs/12, docs/13). Installed in M0-02.
# Every job below is live. rust-toolchain.toml pins the Rust toolchain (channel, profile and components); every job that
# builds Rust installs it with a plain `rustup toolchain install` (no argument: it reads that file), so the CI toolchain cannot
# drift from the one developers get, and not from `stable`. The one exception is `fuzz`, which needs a nightly compiler for
# cargo-fuzz's sanitizers and runs only on the nightly schedule.
#
# Tests that need a tool or a fixture the runner may not have print "SKIPPED" and pass on a developer's machine. Where this file
# is the place that is meant to run them, the job sets the matching YM_REQUIRE_* variable, which turns the skip into a failure:
# YM_REQUIRE_GPU (gpu-lavapipe, ml-backends), YM_REQUIRE_EXTERNAL_TOOLS (dng), YM_REQUIRE_ORACLE (oracle, dng),
# YM_REQUIRE_FIXTURES (spectral-fixtures), YM_REQUIRE_SYNTHETIC (synthetic-set), YM_REQUIRE_ORT (ml-backends) and
# YM_REQUIRE_PARITY_BIN (parity). The macOS `rust` job sets none of them.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # nightly: full oracle corpus, private golden tier, fuzzing; also a fresh advisory check

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  frontend:
    # The schedule trigger exists for the nightly jobs below; the plain build and test jobs skip it.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: npm licence check
        # --excludePrivatePackages: the root package is private and would otherwise be read as UNLICENSED.
        run: npx --yes license-checker@25.0.1 --production --excludePrivatePackages --onlyAllow "MIT;ISC;BSD-2-Clause;BSD-3-Clause;Apache-2.0;0BSD;CC0-1.0;Unlicense;BlueOak-1.0.0;Python-2.0"

  e2e:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  rust:
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install   # rustfmt and clippy come from the file's components
      - uses: Swatinem/rust-cache@v2
      - run: tools/dev/prepare-sidecar.sh   # tauri-build needs the sidecar to exist (docs/01)
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  deny:
    # Also runs on the nightly schedule: new RustSec advisories appear without any change in this repository.
    runs-on: ubuntu-latest   # cargo-deny-action is a container action: Linux runners only
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Proves that deny.toml still rejects GPL, LGPL and banned crates, and still lets the excluded oracle use rawler.
  # Local fixture crates, no network. M0-02: "a test PR adding a GPL crate fails cargo deny".
  deny-selftest:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - run: shellcheck .github/scripts/*.sh
      - run: .github/scripts/deny-selftest.sh

  # AGENTS.md rule 6: the app and the CLI write the same bytes. serde_json keeps object keys sorted (a BTreeMap) unless its
  # `preserve_order` feature is on, and the key order decides the bytes of the `ym:Settings` document inside every exported file.
  # Cargo unifies features, so one dependency anywhere in the graph could switch it on without any line of ours changing. The
  # guard reads the resolved feature graph of ym-core, ym-cli, yellowmoon-app and the whole workspace (all features, all
  # platforms; it compiles nothing, but cargo downloads the sources of the graph first); the self-test proves it fails when the feature is on.
  serde-order:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - run: shellcheck tools/ci/*.sh
      - run: tools/ci/check_serde_order_selftest.sh
      - run: tools/ci/check_serde_order.sh

  # Scripts under tools/fetch: shellcheck plus the stdlib unit tests, which run against a local HTTP
  # server and never touch the network (the corpus hosts are not needed to prove the script logic). The same job runs the other
  # stdlib-only Python tool tests: tools/oracle (the metadata gate's command line), tools/looks (the ARRI package fingerprints)
  # and tools/golden (the LibRaw oracle verdicts), and shellchecks the developer and oracle scripts.
  fetch-tools:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: shellcheck
        run: shellcheck tools/fetch/*.sh tools/dev/*.sh tools/oracle/ci.sh
      - name: fetch tool tests
        run: python3 -I -m unittest discover -s tools/fetch -p 'test_*.py' -v
      - name: oracle, looks and golden tool tests (stdlib only)
        run: |
          python3 -I -m unittest discover -s tools/oracle -p 'test_*.py' -v
          python3 -I -m unittest discover -s tools/looks -p 'test_*.py' -v
          python3 -I -m unittest discover -s tools/golden -p 'test_*.py' -v

  # M0-07: WGSL kernels against their CPU references on Mesa lavapipe (software Vulkan): correctness
  # only, speed means nothing here. Metal behaviour and timings are checked on a Mac (HUMAN M0-H4).
  gpu-lavapipe:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YM_REQUIRE_GPU: "1"
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
      - name: Mesa lavapipe (software Vulkan)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
      - name: Show the adapter
        run: vulkaninfo --summary || true
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Kernel parity, queue, pool, tiles
        run: cargo test -p ym-gpu --release
      - name: 50 MP spike and the GPU memory gate (peak under 1.5 GiB)
        run: cargo test -p ym-gpu --release --test gpu_spike -- --ignored --nocapture gpu_spike_50mp
      # The renderer's GPU colour pass against its CPU reference (ym-core). The test's header says this job runs it, but only
      # `-p ym-gpu` was run here; the one other place was the macOS `rust` job, where the test skips itself and passes when
      # the runner opens no Metal adapter. YM_REQUIRE_GPU (above) makes a missing adapter a failure.
      - name: Renderer colour pass on the GPU against the CPU reference
        run: cargo test -p ym-core --release --test render_gpu

  # M0-05: decoder oracle. LibRaw (rawpy), rawler (tools/oracle) and libjpeg compare ym-raw's pixels,
  # levels and white balance. Test-only: none of them is ever linked into a shipped crate. Until the
  # CC0 corpus is fetchable (tools/fetch/samples.sh) this runs on the synthetic corpus every variant
  # writes through the test-only encoders; the real corpus joins automatically once it exists.
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install rawpy numpy pylibjpeg-libjpeg
      - name: ExifTool (the metadata oracle, tools/oracle/ci.sh runs oracle_exiftool against it)
        run: sudo apt-get update && sudo apt-get install -y libimage-exiftool-perl
      - uses: actions/cache@v4
        with:
          path: testdata/arw
          key: testdata-${{ hashFiles('tools/fetch/manifest.json') }}
      - run: tools/fetch/samples.sh --allow-empty
      - run: ORACLE_OUT="$RUNNER_TEMP/oracle" tools/oracle/ci.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-reports
          path: ${{ runner.temp }}/oracle

  # M1-12: Sony embedded lens corrections against darktable-cli, run as a separate process (GPL tool,
  # never linked or shipped). Synthetic Sony files with lens tags; gates: gain 0.5 %, 0.2 px.
  lens-oracle:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'lens')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y darktable && pip3 install numpy scipy
      - run: tools/lens/run_oracle_suite.sh build/lens-oracle

  # Data, fits and test vectors stay reproducible: camera profiles and registry (M1-04), the spectral
  # reference for the Rust runtime (M1-02), the research reproduction and the sensor-map gate with its
  # one reported failure (M1-05, LED-V2), LUT and ACES 2 vectors against OpenColorIO (M1-10, M1-11),
  # the illuminant estimator (M1-06) and the noise-prior fitting (M2-01).
  data-checks:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r training/requirements.txt opencolorio==2.6.0
      - run: tools/fetch/spectral.sh
      - run: python3 -m training.sensor_map.validate_profiles
      - run: python3 -m training.sensor_map.check_reference
      - run: python3 -m training.sensor_map.evaluate
      - run: python3 -m training.sensor_map.build_profiles --check
      - run: python3 -m training.sensor_map.gate --expect-failing LED-V2
      - run: python3 -I tools/vectors/lut_vectors.py --check
      - run: python3 -I tools/vectors/aces2_vectors.py --check
      - run: pip install -r training/illum/requirements.txt && python3 -m unittest training.illum.test_illum
      - run: python3 -m unittest training.noise.test_public_priors

  # The Rust halves of the colour-science gates: M1-02 (spectral tables against the spectra they came from), M1-04 (Rust
  # reproduces sony_profiles.csv within 0.02), M1-05 (the sensor-map gate numbers) and M1-07 (3200 K under daylight differs from
  # Auto by the amount a spectral simulation predicts). They read testdata/spectral, which the exporter writes from colour-science
  # (CIE data is CC BY-SA 4.0: generated here, never committed). Without it every one of those tests prints SKIPPED and passes,
  # which is what the macOS `rust` job does; YM_REQUIRE_FIXTURES turns a missing folder into a failure. About a minute of tests.
  spectral-fixtures:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      YM_REQUIRE_FIXTURES: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r training/requirements.txt
      - run: tools/fetch/spectral.sh
      - name: Export the fixtures (testdata/spectral)
        run: python3 -m training.sensor_map.export_fixtures
      - name: ym-color and ym-profiles tests with the fixtures required
        run: cargo test -p ym-color -p ym-profiles

  # M1-15: golden images. The real `ym` renders every file of the default synthetic set (61 ARW files, generated here: no
  # download) and `golden check` compares each picture with tools/golden/expected.json (docs/13, "As built (M1-15)").
  #  - ubuntu-24.04 (not macOS, and not `ubuntu-latest`): the renders are CPU code and expected.json was written on Linux x86_64
  #    with glibc 2.39, the libm of Ubuntu 24.04. A render calls the platform libm (sin, exp, pow), so a hash can move by one
  #    code on another libm (docs/13, "Platform"). The moving `ubuntu-latest` label would change that without a commit here.
  #  - `ym` and `golden` are built in two cargo invocations. `golden` switches on ym-raw's test-only `testgen` feature, and one
  #    build gives every package the union of the features: `-p ym-cli -p golden` would put the test writer into the `ym`
  #    under test. (`cargo tree -p ym-cli -p golden -e normal -i ym-raw` shows it.) tools/fetch/synthetic.sh builds golden too,
  #    and that is another invocation again.
  #  - `--require-all`: a file that is not on disk fails the run instead of being skipped, so a half generated set cannot pass.
  #  - The reference pictures (testdata/golden/refs, about 280 MB) live in a cache keyed on expected.json. `--write-missing-refs`
  #    gives every identical picture without a reference file one, so a green run fills the cache; a changed picture is
  #    measured against its reference (a change above ΔE00 0.5 fails). GitHub evicts a cache that nobody has used for seven days,
  #    which is why this job also runs on the nightly schedule.
  #  - The nightly runs the default set, like every push: `--set synthetic-full` has no entries in expected.json yet.
  #  - The synthetic generator gave byte-identical scenes with numpy 2.2.6 / scipy 1.15.3 / Pillow 11.3.0 and with
  #    numpy 2.5.4 / scipy 1.18.1 / Pillow 12.3.0 (colour-science is pinned), so the unpinned requirements are enough for now.
  #    If a hash ever differs on a fresh runner with no code change, pin those three first.
  #  - `golden truth` (end-to-end colour against the ground truth of the synthetic scenes) is a report with no threshold.
  #  - The auto-exposure gate (G3, `tools/eval/autoexp.py --gate`) runs on the same `ym` and the same synthetic set; see the step.
  golden:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      # a release `ym` looks for its data folder next to the executable in an app bundle (docs/01); here it is the checkout's
      YELLOWMOON_DATA: ${{ github.workspace }}/data
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r training/requirements.txt -r training/synth/requirements.txt tifffile   # tifffile: tools/eval reads the renders
      - run: tools/fetch/spectral.sh
      - name: Synthetic ARW set (61 files, a few minutes)
        run: tools/fetch/synthetic.sh --release
      - name: Build ym (the binary under test; no testgen feature)
        run: cargo build --release -p ym-cli
      - name: Build golden (a separate invocation, see above)
        run: cargo build --release -p golden
      - name: Reference pictures
        uses: actions/cache@v4
        with:
          path: testdata/golden/refs
          key: golden-refs-${{ hashFiles('tools/golden/expected.json') }}
      - name: Golden check
        run: target/release/golden check --ym target/release/ym --require-all --write-missing-refs --report golden-report.json
      - name: End-to-end colour against the ground truth (a report, no gate)
        if: ${{ !cancelled() }}   # also after a failed check: the numbers help to see what moved
        shell: bash
        run: |
          target/release/golden truth --ym target/release/ym --report golden-truth.json | tee golden-truth.txt
          { echo '### golden truth (a report, no gate)'; echo '```text'; cat golden-truth.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      # M1-08 gate, metric G3 (docs/13, decision 2026-10-13): `autoexp.py --gate` renders every synthetic scene once (one raw
      # variant per scene, 37 files) with the `ym` just built, reads the camera's gain from the embedded JPEG and exits 3 when
      # fewer than 80 % of the files have |EV_auto - camera gain| <= 0.5 EV. THIS CHECKS THE MACHINERY, NOT SONY: the synthetic
      # JPEG is our own rendering (training/synth/preview.py) with a known gain, so the scenes tell whether the estimator, the
      # exposure algorithm and the arithmetic still agree, and say nothing about a real camera. The real files and the CC0
      # tier run the same command locally (tools/eval/run.sh) until a golden corpus exists; outliers there go to M1-H5.
      - name: Auto-exposure gate (G3) on the synthetic tier - the machinery, not Sony
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          code=0
          python3 -I tools/eval/autoexp.py testdata/synthetic/arw --ym target/release/ym --label synthetic --one-per-scene \
            --out autoexp-out --gate --tolerance-ev 0.5 --min-fraction 0.8 | tee autoexp-gate.txt || code=$?
          { echo '### auto-exposure gate (G3, synthetic tier: the machinery, not Sony)'; echo '```text'; sed -n '/^M1-08 gate/,$p' autoexp-gate.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-reports
          path: |
            golden-report.json
            golden-truth.json
            golden-truth.txt
            autoexp-gate.txt
            autoexp-out/report.md
            autoexp-out/results.json
          if-no-files-found: ignore

  # M3-12: every exported DNG passes Adobe's dng_validate, and its render is within a median ΔE00 of 1.5 of our JPEG (docs/09
  # Gates). tools/dng/run_gates.sh is the same script a developer runs: it builds `ym` and `dngfit` (two cargo invocations, for
  # the reason given at the golden job), runs `dngfit eval` and `dngfit gate --require-all`. dng_validate is built from the DNG SDK
  # at a pinned commit (about 10 minutes) and the binary is cached; the key has the Ubuntu release because the binary links the
  # system libjpeg and zlib. The image is pinned to ubuntu-24.04, the one this was run on (libjpeg-turbo 2.1.5, the libjxl 0.7
  # headers): the SDK build and the stub in tools/dng/dng_jxl_stub.cpp are not known to build against the headers of a newer
  # libjxl. The tests run apart from the gates: `cargo test -p ym-export --test dng_validate` runs that one test
  # target only, so `-p dngfit` needs its own command. YM_REQUIRE_EXTERNAL_TOOLS turns "SKIPPED: tool missing" into a failure.
  dng:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      YM_REQUIRE_EXTERNAL_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: System libraries and ExifTool
        run: sudo apt-get update && sudo apt-get install -y libjpeg-dev zlib1g-dev libjxl-dev libimage-exiftool-perl
      - run: pip install -r training/requirements.txt -r training/synth/requirements.txt tifffile
      - name: Ubuntu release (part of the dng_validate cache key)
        id: os
        run: echo "release=$(. /etc/os-release && echo "$VERSION_ID")" >> "$GITHUB_OUTPUT"
      - name: dng_validate (cached binary)
        id: dng_sdk
        uses: actions/cache/restore@v4
        with:
          path: testdata/dng_sdk/dng_validate
          key: dng-validate-ubuntu-${{ steps.os.outputs.release }}-${{ hashFiles('tools/dng/build_dng_validate.sh', 'tools/dng/dng_jxl_stub.cpp') }}
      - name: Build dng_validate from the DNG SDK
        if: steps.dng_sdk.outputs.cache-hit != 'true'
        run: tools/dng/build_dng_validate.sh testdata/dng_sdk
      # Saved here and not by the cache action's post step, which runs only when the whole job passed: a gate that fails
      # further down would otherwise throw the 10 minute build away on every push until the gate is fixed.
      - name: Keep the built dng_validate
        if: steps.dng_sdk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: testdata/dng_sdk/dng_validate
          key: ${{ steps.dng_sdk.outputs.cache-primary-key }}
      - run: tools/fetch/spectral.sh
      - name: Synthetic ARW set
        run: tools/fetch/synthetic.sh --release
      - name: Writer tests against dng_validate, LibRaw, ExifTool and tifffile
        run: cargo test --release -p ym-export --test dng_validate
      - name: Profile fit tests
        run: cargo test --release -p dngfit
      # M1-13 (docs/09 Tests): ICC profiles read back by LittleCMS (Pillow), Lanczos in linear light against Pillow, and the
      # TIFF, PNG and JPEG structure read by independent decoders. They share this job's tools; with YM_REQUIRE_EXTERNAL_TOOLS
      # a missing module is a failure, not "SKIPPED". The macOS `rust` job has none of the tools and skips them.
      - name: Writer tests against LittleCMS, Pillow and tifffile (ICC, resize, structure)
        run: cargo test --release -p ym-export --test icc_lcms --test resize_reference --test structure
      # M0-04 (docs/04): the metadata of synthetic Sony files against ExifTool. YM_REQUIRE_ORACLE makes a missing ExifTool fail.
      - name: Metadata against ExifTool
        env:
          YM_REQUIRE_ORACLE: "1"
        run: cargo test --release -p ym-raw --test oracle_exiftool
      - name: DNG gates on the golden set
        run: tools/dng/run_gates.sh --png

  # The synthetic golden set (stand-in for the CC0 corpus): generator unit tests, the ARW writer's round
  # trips for every variant, and LibRaw reading the written files. `cargo test -p golden` also renders two files with the
  # real `ym` (tools/golden/tests/real_ym.rs) and reads every sidecar (sidecar.rs); `ym` is built first, in its own cargo
  # invocation (see the golden job for why), and YM_REQUIRE_SYNTHETIC turns "SKIPPED: needs the ym binary" into a failure.
  synthetic-set:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 75   # a cold cache also builds ym (debug) for the smoke tests
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r training/requirements.txt -r training/synth/requirements.txt rawpy
      - run: tools/fetch/spectral.sh
      - run: python3 -m unittest training.synth.test_synth
      - run: tools/fetch/synthetic.sh --oracle
      - name: ym, the binary the smoke tests render with
        run: cargo build -p ym-cli
      - name: Golden runner tests (writer, sidecars, two real renders)
        env:
          YM_REQUIRE_SYNTHETIC: "1"
        run: cargo test -p golden

  # tools/eval: the unit tests of the auto-exposure study and of its M1-08 gate logic (G3, `--gate`). Pure numpy/Pillow/tifffile;
  # the one test that runs `ym` skips itself when there is no binary or no synthetic set. The gate itself runs in the golden job.
  eval-tools:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy pillow tifffile
      - run: python3 -I -m unittest discover -s tools/eval -p 'test_*.py'

  # THIRD-PARTY.md (NOTICE item 9, the About dialog): the licence texts of the Rust crates, npm packages and fonts that ship.
  # The release workflow generates it before `tauri build`; this job runs the same generator on every change, so a new
  # dependency without a licence text, a broken cargo-about config or a bundle that stops carrying the file fails here and not on
  # the day of a release. `check_bundle.py` also holds NOTICE to the BSD 3-Clause conditions of the ported Menon demosaic.
  # cargo-about 0.9.2 comes as a prebuilt binary; the generator fetches the crates of the two macOS targets and reads their
  # LICENSE files offline. tools/licences/README.md has the details.
  licences:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2
      - run: npm ci
      - name: Generator and bundle-check tests
        run: python3 -I -m unittest discover -s tools/licences -p 'test_*.py' -v
      - name: Generate THIRD-PARTY.md (fails on a package without a licence text)
        run: python3 tools/licences/generate.py
      - name: The bundle carries THIRD-PARTY.md, NOTICE and LICENSE, and NOTICE carries the BSD conditions
        run: python3 tools/licences/check_bundle.py
      - uses: actions/upload-artifact@v4
        with:
          name: third-party
          path: THIRD-PARTY.md

  # AGENTS.md rule 6, across SEPARATE builds, and rustdoc.
  #  - Parity. One cargo invocation gives every package the union of the features that any selected package wants, so a test
  #    that builds the app path and `ym` together (crates/ym-cli/tests/parity.rs) cannot see a difference that only exists
  #    when they are built apart, which is how they ship (the app bundle gets `ym` from `cargo build -p ym-cli`, the app is
  #    its own `cargo build`). Here `ym` is built alone (tools/dev/prepare-sidecar.sh: also the app's sidecar) and kept; then
  #    `cargo test -p yellowmoon-app` builds the app's graph on its own and exports the same synthetic ARW in every format
  #    (JPEG, TIFF 8/16-bit with LZW, ZIP and none, PNG 8/16-bit, DNG) through `ym_core::app::Core::export_start` (what the
  #    Tauri commands call) and through that `ym` (src-tauri/tests/app_cli_parity.rs, `YM_BIN`), and compares the bytes. It
  #    runs headless on Linux with no X server: the test opens no window and starts no Tauri runtime. The in-crate test of the
  #    command layer (JPEG, the export defaults) runs against the same binary. What stays Mac-only: the real window, the
  #    native viewport, the Metal path (M0-H4).
  #  - Rustdoc. `RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps` (broken intra-doc links, bare URLs, unclosed
  #    HTML) was never run in CI before; the sidecar and the Tauri libraries it needs are here for the parity test anyway.
  parity:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Tauri system libraries (the app crate is built here; no window is opened)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev
      - name: ym, built by itself (also the app's sidecar)
        run: tools/dev/prepare-sidecar.sh
      - name: Keep that ym, and show that the two builds differ in features
        shell: bash
        run: |
          cp target/debug/ym "$RUNNER_TEMP/ym-alone"
          echo "ym-raw in the build of ym (must not have testgen):"
          cargo tree -p ym-cli -e normal -i ym-raw -f '{p} [{f}]' | tee "$RUNNER_TEMP/ym-raw-in-ym.txt"
          if grep -q testgen "$RUNNER_TEMP/ym-raw-in-ym.txt"; then echo "::error::ym is built with the test-only ARW writer"; exit 1; fi
          echo "ym-raw in the build of the app's tests:"
          cargo tree -p yellowmoon-app -e normal,dev -i ym-raw -f '{p} [{f}]'
      - name: App export path in its own build against that ym (every format, byte for byte)
        env:
          YM_BIN: ${{ runner.temp }}/ym-alone
          YM_REQUIRE_PARITY_BIN: "1"
        run: |
          cargo test -p yellowmoon-app --test app_cli_parity -- --nocapture
          cargo test -p yellowmoon-app the_app_and_the_command_line_write_the_same_bytes
      - name: Rustdoc (warnings are errors)
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps

  # M2-05: the jdd training code stays runnable (50 steps on CPU, synthetic data only), plus its unit
  # tests and the golden-tile parity check. Real training needs a GPU and PixelShift200 (HUMAN M2-H4).
  training-dry-run:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r training/jdd/requirements.txt
      - run: make -C training/jdd dry-run test golden-check

  # M2-07: the two optional model runtimes behind `TileModel` (docs/07), each against PyTorch's golden tiles within 2e-3: burn on
  # wgpu (Mesa lavapipe here) and ONNX Runtime (the library comes from the Python wheel; ym-ml loads it at run time). Both are
  # off by default, so no other job compiles, lints or runs them; the CPU runtime that ships is covered by `cargo test
  # --workspace`. They are candidates (the runtime choice is still open, docs/16), and this keeps them from rotting. burn is a
  # large dependency: the first run is slow and the cache keeps the rest. YM_REQUIRE_GPU and YM_REQUIRE_ORT make a missing
  # adapter or library a failure instead of "skipped".
  ml-backends:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      YM_REQUIRE_GPU: "1"
      YM_REQUIRE_ORT: "1"
      WGPU_BACKEND: vulkan
    steps:
      - uses: actions/checkout@v4
      - name: Mesa lavapipe (software Vulkan)
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: ONNX Runtime library (the version the tests were run with)
        run: |
          pip install onnxruntime==1.29.0
          lib=$(python3 -c "import glob, os, onnxruntime; print(sorted(glob.glob(os.path.join(os.path.dirname(onnxruntime.__file__), 'capi', 'libonnxruntime.so*')))[0])")
          echo "ORT_DYLIB_PATH=$lib" >> "$GITHUB_ENV"
      - run: cargo clippy -p ym-ml --all-targets --features burn,ort -- -D warnings
      - run: cargo test -p ym-ml --features burn,ort

  # Fuzzing (docs/13): every cargo-fuzz target runs for 10 minutes each night (property: no panic, no unbounded allocation, a
  # typed error for any input). One job per target, so a crash names its target and the others still run. The targets are
  # crates/ym-raw/fuzz (the ARW container and the decoders, docs/04) and crates/ym-color/fuzz (the `.cube` parser and the look
  # JSON, docs/02); each is its own workspace and needs a nightly compiler, which is why this is the one job that does not use
  # the pinned toolchain. ym-raw's seeds are valid synthetic files from `gen_seeds`; ym-color's are in the repository. Each
  # night continues from the corpus of the last one (the cache). A crash is uploaded; turn it into a unit test in the crate before
  # fixing it. The longer campaign is M4-05.
  fuzz:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { crate: ym-raw, target: tiff_walker, dict: fuzz/dictionaries/tiff.dict }
          - { crate: ym-raw, target: sr2 }
          - { crate: ym-raw, target: probe, dict: fuzz/dictionaries/tiff.dict }
          - { crate: ym-raw, target: craw }
          - { crate: ym-raw, target: ljpeg }
          - { crate: ym-raw, target: ycbcr }
          - { crate: ym-raw, target: decode_any, dict: fuzz/dictionaries/tiff.dict }
          - { crate: ym-color, target: cube_parse }
          - { crate: ym-color, target: look_json }
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain from rust-toolchain.toml (the seed generator is an ordinary workspace example)
        run: rustup toolchain install
      - name: Nightly compiler for cargo-fuzz
        run: rustup toolchain install nightly --profile minimal
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/${{ matrix.crate }}/fuzz -> target
      - name: cargo-fuzz
        run: cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Corpus of the last night
        uses: actions/cache/restore@v4
        with:
          path: crates/${{ matrix.crate }}/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.crate }}-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.crate }}-${{ matrix.target }}-
      - name: Seeds from valid synthetic files
        if: matrix.crate == 'ym-raw'
        run: cargo run -p ym-raw --features testgen --example gen_seeds -- --fuzz-root crates/ym-raw/fuzz/corpus
      - name: Fuzz for 10 minutes
        working-directory: crates/${{ matrix.crate }}
        env:
          TARGET: ${{ matrix.target }}
          DICT: ${{ matrix.dict }}
        run: |
          args=(-max_total_time=600 -rss_limit_mb=2048 -timeout=20)
          if [ -n "$DICT" ]; then args+=("-dict=$DICT"); fi
          cargo +nightly fuzz run "$TARGET" -- "${args[@]}"
      - name: Keep the corpus
        if: always()
        uses: actions/cache/save@v4
        with:
          path: crates/${{ matrix.crate }}/fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.crate }}-${{ matrix.target }}-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crash-${{ matrix.crate }}-${{ matrix.target }}
          path: crates/${{ matrix.crate }}/fuzz/artifacts
          if-no-files-found: ignore
