# The evaluation of the Depth mask's runtime (D-06, Gate D of docs/15-milestones.md; the metric is
# docs/algorithms/06-masks.md section 8.8). By hand only: DIODE's validation split is a 2.6 GB download and the run takes
# about an hour, so it does not belong on every push, and nothing here may block a pull request. Two independent jobs:
#   diode        the DIODE ordering of our Rust runtime against the upstream PyTorch model, on the same pictures and pairs;
#                the job fails when the two differ by more than 0.5 percentage points (the gate)
#   mac-timing   the runtime's time on a hosted Apple-silicon runner (a number for docs/STATUS.md, not the owner's Mac: M0-H4 stays)
#
# How to run, two ways:
#   1. Push a branch named eval/depth-** (for example eval/depth-diode-1). GitHub dispatches a workflow only when its file is on
#      the default branch, so while this file lives on a feature branch the push trigger is the way to start it. A push has no
#      inputs: it runs the whole validation split (every = 1) and accepts the placeholder pin (see ACCEPT_NEW below).
#   2. Actions > depth-eval > Run workflow, on the branch (once the file is on the default branch). The first time, tick
#      `accept_new`. `every` takes every N-th picture for a quick check (a partial run is a partial gate).
# training/depth/diode.sha256 holds a placeholder at first, and the run then prints the archive's SHA-256 in its summary instead
# of stopping; copy that line into the file (the next runs check it).
#
# Python and the network are CI tooling here (AGENTS.md rules 6 and 7): the app and `ym` run neither, and DIODE (MIT) is
# evaluation data that is downloaded in the job and never committed.
name: depth-eval

on:
  push:
    branches: ["eval/depth-**"]
  workflow_dispatch:
    inputs:
      accept_new:
        description: "Go on when the DIODE archive has no SHA-256 pin yet (the hash is printed in the summary). Only for the first run."
        type: boolean
        default: false
      every:
        description: "Use every N-th picture of the sorted validation list (1 = all 771; 8 is a 15 minute smoke run)"
        type: string
        default: "1"

permissions:
  contents: read

jobs:
  diode:
    runs-on: ubuntu-latest
    # By estimate: 771 pictures x (the Rust runtime about 3 s on 4 CPUs + PyTorch about the same + the PNG and .npy file work)
    # is 40 to 80 minutes on the 4-CPU hosted runner of a public repository, twice that on 2 CPUs, plus about 15 minutes for the
    # download, the extraction, the first build and the installs. Six hours is the hard limit of a hosted job; 300 minutes leaves
    # room for the 2-CPU case without letting a hung run use the whole day. The first run's real time goes to docs/13.
    timeout-minutes: 300
    env:
      # github.com/DepthAnything/Depth-Anything-V2 (Apache-2.0), the commit the oracle uses (training/depth/export.py).
      DEPTH_COMMIT: a561b849ebae10a6f5ef49e26c83cbbcd36c71bf
      TORCH: "2.5.1+cpu"
      TORCHVISION: "0.20.1+cpu"
      PYTHONUNBUFFERED: "1"
      # A release build finds data/ only inside an app bundle (docs/01, "Finding data/"); point it at the repository's.
      YELLOWMOON_DATA: ${{ github.workspace }}/data
    defaults:
      run:
        shell: bash   # with pipefail, so that "python | tee" fails when python does
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install   # reads the file; no argument

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: depth-eval
          cache-on-failure: true

      # The runtime reads data/models/depth/*.safetensors, checked against SHA256SUMS; the file comes from our own release.
      - name: Depth weights
        run: tools/fetch/depth.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            training/depth/requirements.txt
            .github/workflows/depth-eval.yml

      # The same packages as the oracle (models.yml, job `depth`): CPU torch, then the upstream code at its pinned commit. The
      # upstream model is the reference of the gate, so it must be the model that made the D-03 fixtures.
      - name: Install the pinned packages (CPU torch, then the upstream code at its pinned commit)
        run: |
          python -m pip install --upgrade pip==24.3.1
          python -m pip install -r training/depth/requirements.txt
          python -m pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch==${TORCH}" "torchvision==${TORCHVISION}"
          git clone --quiet https://github.com/DepthAnything/Depth-Anything-V2.git "$RUNNER_TEMP/depth-anything-v2-src"
          git -C "$RUNNER_TEMP/depth-anything-v2-src" checkout --quiet "${DEPTH_COMMIT}"
          test "$(git -C "$RUNNER_TEMP/depth-anything-v2-src" rev-parse HEAD)" = "${DEPTH_COMMIT}"
          echo "DEPTH_ANYTHING_V2_SRC=$RUNNER_TEMP/depth-anything-v2-src" >> "$GITHUB_ENV"

      # The metric's own tests first: a mistake in the pair sampling would make the gate meaningless, and they take a second.
      - name: Unit tests of the metric
        run: python -m unittest training.depth.test_eval_diode training.depth.test_depth

      # The archive is 2.6 GB and a download can fail half way; the cache is keyed by the pin, so a new pin means a new archive.
      # Saved after the run whatever its result, because a failed gate is a reason to look at the numbers, not to download again.
      - name: Cache of the DIODE archive
        id: archive
        uses: actions/cache/restore@v4
        with:
          path: build/depth-eval/val.tar.gz
          key: diode-val-${{ hashFiles('training/depth/diode.sha256') }}

      - name: Build the Rust half (the depth_maps example)
        run: cargo build --release -p ym-ml --example depth_maps

      - name: DIODE ordering, Rust runtime against PyTorch
        env:
          # On a push the inputs are empty. A push accepts the placeholder pin; this is safe because fetch_archive still refuses
          # a hash that differs from a real pin, so only the placeholder is ever accepted.
          ACCEPT_NEW: ${{ github.event_name == 'push' || inputs.accept_new }}
          EVERY: ${{ inputs.every || '1' }}
        run: |
          # Inputs go through env, never into the command line.
          flags=()
          if [ "$ACCEPT_NEW" = "true" ]; then flags+=(--accept-new); fi
          mkdir -p build/depth-eval/out
          python -m training.depth.eval_diode \
            --upstream "$DEPTH_ANYTHING_V2_SRC" \
            --weights data/models/depth/depth_anything_v2_vits.f16.safetensors \
            --depth-maps target/release/examples/depth_maps \
            --data-root data \
            --scratch build/depth-eval \
            --out build/depth-eval/out \
            --every "$EVERY" \
            "${flags[@]}" 2>&1 | tee build/depth-eval/eval.log

      - name: Save the DIODE archive for the next run
        if: ${{ always() && steps.archive.outputs.cache-hit != 'true' && hashFiles('build/depth-eval/val.tar.gz') != '' }}
        uses: actions/cache/save@v4
        with:
          path: build/depth-eval/val.tar.gz
          key: diode-val-${{ hashFiles('training/depth/diode.sha256') }}

      # The summary is written whatever happened: the table of a failed gate, or (on the first run) the line for diode.sha256.
      - name: Job summary
        if: ${{ always() }}
        run: |
          {
            if [ -f build/depth-eval/out/summary.md ]; then
              cat build/depth-eval/out/summary.md
            else
              echo "### DIODE ordering: no result"
              echo
              echo '```'
              tail -n 25 build/depth-eval/eval.log 2>/dev/null || echo "the evaluation did not start"
              echo '```'
            fi
            grep -E '^[0-9a-f]{64}  val\.tar\.gz$' build/depth-eval/eval.log 2>/dev/null | {
              read -r line || exit 0
              echo
              echo "SHA-256 line for \`training/depth/diode.sha256\` (check it came from the DIODE link first):"
              echo '```'
              echo "$line"
              echo '```'
            } || true
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: depth-diode-report
          path: |
            build/depth-eval/out/report.json
            build/depth-eval/out/summary.md
            build/depth-eval/eval.log
          if-no-files-found: ignore

  mac-timing:
    # Apple silicon, GitHub-hosted. This is NOT the owner's Mac: the runner is shared and virtualised, its numbers are a floor for
    # "does it run and about how long", and M0-H4 (the timing on the owner's machine) stays on the list. The summary says so.
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain from rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: depth-eval-mac
          cache-on-failure: true

      # depth_bench runs the real network shapes on seeded random weights (the cost does not depend on the values), so no weights
      # are fetched. It prints the best of 3 on all threads and on one, at the default 784 x 518 and at the cap's largest 1036 x 518.
      - name: Time the runtime
        run: |
          cargo build --release -p ym-ml --example depth_bench
          {
            echo "default 784 x 518"
            target/release/examples/depth_bench
            echo
            echo "1036 x 518"
            target/release/examples/depth_bench 1036 518
          } 2>&1 | tee depth-bench.txt

      - name: Job summary
        if: ${{ always() }}
        run: |
          {
            echo "### Depth runtime timing on a GitHub-hosted Apple-silicon runner"
            echo
            echo "This is the hosted \`macos-15\` runner, **not the owner's Mac**; it is shared, so treat the numbers as an upper bound for the order of magnitude. M0-H4 (the timing on the owner's machine) stays open."
            echo
            echo "- CPU: $(sysctl -n machdep.cpu.brand_string)"
            echo "- Logical CPUs: $(sysctl -n hw.ncpu)"
            echo "- Memory: $(( $(sysctl -n hw.memsize) / 1073741824 )) GiB"
            echo "- macOS: $(sw_vers -productVersion)"
            echo
            echo '```'
            cat depth-bench.txt 2>/dev/null || echo "the benchmark did not run"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: depth-mac-timing
          path: depth-bench.txt
          if-no-files-found: ignore
