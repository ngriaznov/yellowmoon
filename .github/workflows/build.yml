# Build: a test build of the macOS app, by hand only (Actions > Build > Run workflow; universal or Apple silicon
# only). Downloads for people are GitHub Releases (release.yml, every version bump on main); this is for trying a
# branch or a commit before a release. The disk image is the run's artefact "Yellowmoon-<commit>-<architecture>",
# kept for 14 days. No updater artefacts; signed ad hoc like a release (no Apple Developer ID, docs/16), so macOS
# asks once before it opens it (README, "Allow Yellowmoon to open").
name: Build

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Architecture: universal (Apple silicon and Intel) or aarch64 (Apple silicon only, about half the build time)"
        type: choice
        options: [universal, aarch64]
        default: universal

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      TARGET: ${{ inputs.target || 'universal' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Add both macOS targets to the pinned toolchain
        # rust-toolchain.toml pins the version, which overrides the toolchain installed above.
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-macos-${{ env.TARGET }}

      - name: Install frontend dependencies
        run: npm ci

      # The bundle carries the licence texts of every dependency next to NOTICE (as release.yml does).
      - name: cargo-about
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.2

      - name: Licence texts of the dependencies (THIRD-PARTY.md, bundled next to NOTICE)
        run: |
          python3 tools/licences/generate.py
          python3 tools/licences/check_bundle.py

      - name: Build the command-line tool (the app's sidecar `ym`)
        run: |
          mkdir -p src-tauri/binaries
          cargo build -p ym-cli --release --target aarch64-apple-darwin
          cp target/aarch64-apple-darwin/release/ym src-tauri/binaries/ym-aarch64-apple-darwin
          if [ "$TARGET" = universal ]; then
            cargo build -p ym-cli --release --target x86_64-apple-darwin
            cp target/x86_64-apple-darwin/release/ym src-tauri/binaries/ym-x86_64-apple-darwin
            lipo -create \
              target/aarch64-apple-darwin/release/ym \
              target/x86_64-apple-darwin/release/ym \
              -output src-tauri/binaries/ym-universal-apple-darwin
            lipo -info src-tauri/binaries/ym-universal-apple-darwin
          fi

      - name: Build the app (ad-hoc signed, no updater artefacts)
        run: |
          if [ "$TARGET" = universal ]; then TRIPLE=universal-apple-darwin; else TRIPLE=aarch64-apple-darwin; fi
          echo "TRIPLE=$TRIPLE" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          npm run tauri build -- --target "$TRIPLE" \
            --config '{"bundle":{"createUpdaterArtifacts":false,"macOS":{"signingIdentity":"-"}}}'

      - name: Check the bundle
        run: |
          APP="target/$TRIPLE/release/bundle/macos/Yellowmoon.app"
          ls -la "target/$TRIPLE/release/bundle/dmg/"
          codesign --verify --deep --strict --verbose=2 "$APP"
          lipo -info "$APP/Contents/MacOS/Yellowmoon"
          "$APP/Contents/MacOS/ym" --version
          "$APP/Contents/MacOS/ym" doctor || echo "::warning title=ym doctor::exited with $? (informational)"
          {
            echo "### Yellowmoon test build"
            echo
            echo "Commit \`$SHORT_SHA\`, $TARGET. Download the artefact below, unzip it and open the disk image."
            echo "The app has no Apple Developer ID: allow it once as the README says (\"Allow Yellowmoon to open\")."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: Yellowmoon-${{ env.SHORT_SHA }}-${{ env.TARGET }}
          path: target/${{ env.TRIPLE }}/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14

  # The native viewport on a real Mac (docs/01 §Native viewport), which no other job can see: a development build of the app opens
  # the owner's photos at start (YM_SMOKE_OPEN, debug builds only) and the screen is captured once the photo is drawn. The screenshot
  # and the app's log are the artefact "viewport-<commit>". The job fails when the log does not say that the native viewport showed a
  # picture; whether the picture is visible on the screen (and not covered by the page) is what the screenshot is for.
  viewport:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: viewport-macos

      - name: Build the frontend
        run: npm ci && npm run build

      # The owner's photos (Mykyta allows them in CI, NOTICE item 10), as in mac-gpu.yml.
      - name: Owner photos (readme-photos branch, Git LFS)
        id: owner
        uses: actions/cache@v4
        with:
          path: |
            testdata/readme-photos/src
            !testdata/readme-photos/src/.git
          key: owner-photos-${{ hashFiles('tools/fetch/owner-photos.sha256') }}
      - name: Fetch the owner photos (cache miss)
        if: ${{ steps.owner.outputs.cache-hit != 'true' }}
        uses: actions/checkout@v4
        with:
          ref: readme-photos
          lfs: true
          path: testdata/readme-photos/src
          persist-credentials: false
      - name: Verify the owner photos
        run: cd testdata/readme-photos/src && shasum -a 256 -c "$GITHUB_WORKSPACE/tools/fetch/owner-photos.sha256"

      - name: Build the app (development profile, the frontend embedded)
        run: |
          # tauri-build wants the sidecar and the bundled licence texts to exist; this check never runs or bundles them.
          mkdir -p src-tauri/binaries
          : > src-tauri/binaries/ym-aarch64-apple-darwin
          [ -e THIRD-PARTY.md ] || : > THIRD-PARTY.md
          cargo build -p yellowmoon-app --features custom-protocol

      - name: Open the photos and capture the screen
        run: |
          mkdir -p viewport
          YM_SMOKE=1 YM_SMOKE_HOLD=90 YM_SMOKE_OPEN="$GITHUB_WORKSPACE/testdata/readme-photos/src" \
            target/debug/yellowmoon-app > viewport/app.log 2>&1 &
          pid=$!
          # One capture early, while the app surely runs, and one once the picture is there (or after 60 s).
          sleep 15
          screencapture -x viewport/screen-15s.png || echo "::warning title=screencapture::the screen could not be captured"
          for _ in $(seq 1 45); do
            grep -q "the native viewport shows a picture" viewport/app.log && break
            sleep 1
          done
          # The window settles (thumbnails, the sharp pass) before the capture.
          sleep 5
          screencapture -x viewport/screen.png || echo "::warning title=screencapture::the screen could not be captured"
          status=0
          wait "$pid" || status=$?
          cat viewport/app.log
          if ! grep -q "the native viewport shows a picture" viewport/app.log; then
            echo "::error title=Native viewport::the app never showed a picture in the native viewport (viewport/app.log)"
            exit 1
          fi
          exit "$status"

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: viewport-${{ github.sha }}
          path: viewport/
          retention-days: 14
