[package]
name = "ym-ml"
description = "Learned-model runtime: model loading and tiled inference behind one trait."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[features]
default = []
# Optional GPU/ONNX backends behind `TileModel` (docs/07 section Runtime). Both are OFF by default and are
# not compiled (nor downloaded) unless asked for: `cargo build -p ym-ml --features burn,ort`.
# `burn` also brings `ym-gpu` (feature `ml`: its device is requested the way burn's wgpu backend requests one) so that the
# application's own device can be imported (`burn_backend::import_device`, `tests/burn_shared_device.rs`); a build without
# `burn` compiles neither.
burn = ["dep:burn", "dep:ym-gpu"]
ort = ["dep:ort"]
# CoreML execution provider for ONNX Runtime on macOS (cannot be built or tested on Linux).
coreml = ["ort", "ort/coreml"]

[dependencies]
thiserror.workspace = true
rayon.workspace = true
half.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
# `exp` and `log2` of the bokeh network's input and output stages, the same bits on every platform (docs/21 section 9). MIT.
libm = "0.2"
safetensors = "0.8"
burn = { version = "0.22", default-features = false, features = ["std", "wgpu"], optional = true }
# The device the image pipeline owns (`docs/17-gpu.md` section 14); `ml` makes it importable into burn. Only with `burn`.
ym-gpu = { workspace = true, optional = true, features = ["ml"] }
# `load-dynamic`: ONNX Runtime is loaded at run time from ORT_DYLIB_PATH (nothing is downloaded at build time).
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "load-dynamic"], optional = true }

[dev-dependencies]
approx.workspace = true
libc = "0.2"
# `examples/bokeh_maps.rs` writes false-colour PNGs of the bokeh maps.
png.workspace = true
tempfile.workspace = true

[[example]]
name = "bench"
path = "examples/bench.rs"

[[example]]
name = "bokeh_maps"
path = "examples/bokeh_maps.rs"
