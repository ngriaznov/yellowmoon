[package]
name = "ym-export"
description = "Export writers: JPEG, TIFF, PNG and DNG, with ICC, EXIF and XMP."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[dependencies]
ym-color.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
sha2.workspace = true
# Image container and codec crates (docs/14: MIT / Apache-2.0; jpeg-encoder is "(MIT OR Apache-2.0) AND IJG").
# The `dng` crate (AGPL) and rawler's writer (LGPL) are banned; the DNG writer is ours, on top of `tiff`.
tiff.workspace = true
png.workspace = true
jpeg-encoder.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
# Decoders for round-trip tests only (already in the build through `tiff`).
zune-jpeg = "0.5"
