[package]
name = "ym-export"
description = "Export writers: JPEG, TIFF, PNG and DNG, with ICC, EXIF and XMP."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[dependencies]
ym-color.workspace = true
# Output sharpening of the picture after the resize (`ym_gpu::cpu::output_sharpen`). ym-gpu
# depends on ym-color and ym-noise only, so there is no cycle; the stage is CPU code and uses no GPU.
ym-gpu.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
rayon.workspace = true
sha2.workspace = true
# Image container and codec crates (docs/14: MIT / Apache-2.0; jpeg-encoder is "(MIT OR Apache-2.0) AND IJG").
# The `dng` crate (AGPL) and rawler's writer (LGPL) are banned; the DNG writer is ours, on top of `tiff`.
tiff.workspace = true
png.workspace = true
jpeg-encoder.workspace = true
# Pins the deflate backend of PNG (IDAT, iCCP) and TIFF-ZIP to zlib-rs. Cargo features are additive: `ym-looks` pulls
# `zip` with `deflate-flate2-zlib-rs`, so every workspace build already deflates with zlib-rs, while a build of this
# crate alone (cargo test -p ym-export) would use miniz_oxide and write other bytes. Declaring the feature here makes
# both the same, as the CLI and the app need (same inputs, same bytes). Not used in code. Licence: MIT OR Apache-2.0
# (flate2), Zlib (zlib-rs); both are already in the build.
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
# Decoders for round-trip tests only (already in the build through `tiff`).
zune-jpeg = "0.5"
