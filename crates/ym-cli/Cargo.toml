[package]
name = "ym-cli"
description = "The `ym` command-line tool: the same core as the app, bit-identical exports."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "ym"
path = "src/main.rs"

[dependencies]
ym-core.workspace = true
ym-raw.workspace = true
ym-color.workspace = true
ym-export.workspace = true
ym-gpu.workspace = true
ym-looks.workspace = true
ym-profiles.workspace = true
# Apple Auto's bridge (docs/19): `ym_apple::system_advisor()`, the advisor `ym` hands to the core. On
# Apple silicon with the macOS 27 SDK it carries the Swift bridge, and `build.rs` links FoundationModels
# weakly; everywhere else it is a stub that says why Apple Auto is not available. Our own crate.
ym-apple.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
png.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# Ctrl-C (and SIGTERM): finish the current tile, delete the partial file, exit 130 (docs/10).
# MIT OR Apache-2.0.
ctrlc = { version = "3", features = ["termination"] }

[features]
# TEST-ONLY. Builds `ym` so that the environment variable `YM_FORCE_DEMOSAIC=<method name>` picks the
# R6 demosaic method of full-resolution renders (`ym-core`'s `force-demosaic` feature). Off by
# default and not part of any shipped build; the tests of this crate get it through their
# dev-dependency on `ym-core`, and the parity job that builds `ym` on its own can ask for it with
# `cargo build -p ym-cli --features force-demosaic` (`src-tauri/tests/app_cli_parity.rs`).
force-demosaic = ["ym-core/force-demosaic"]

[dev-dependencies]
# The test-only demosaic switch, so that the binary the tests start can be told to use another
# method (the switch reads an environment variable that is never set outside the tests). Only
# `cargo test` sees this: `cargo build -p ym-cli` and the sidecar build do not.
ym-core = { workspace = true, features = ["force-demosaic"] }
# `testgen` writes the synthetic ARW files the tests run on.
ym-raw = { workspace = true, features = ["testgen"] }
assert_cmd.workspace = true
predicates.workspace = true
serde_json.workspace = true
tempfile.workspace = true
insta.workspace = true
