[package]
name = "ym-color"
description = "Colour maths: LogC, ARRI Wide Gamut, sensor map, looks, LUTs and the ACES 2 output transform (CPU reference)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[dependencies]
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
# SHA-256 check of the illuminant model's tensors at load (illum). MIT OR Apache-2.0, already in the workspace.
sha2.workspace = true

[dev-dependencies]
proptest.workspace = true
# JPEG decoder for the auto-exposure gate's embedded-JPEG comparison tests (licence MIT OR Apache-2.0 OR Zlib;
# already in the build through ym-export's tests). Tests only.
zune-jpeg = "0.5"

# Plain timing harness (no criterion): `cargo bench -p ym-color --bench color_cpu`.
[[bench]]
name = "color_cpu"
harness = false
