[package]
name = "ym-agents"
description = "Auto providers that run the person's own Claude Code (claude) and Antigravity (agy) programs (docs/22)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[features]
# Helpers for the tests of other crates (`ym_agents::testing`): where the two test doubles are. Not part of any shipped build.
test-support = []

[dependencies]
ym-core.workspace = true
# Finding the programs: PATH and PATHEXT (MIT).
which.workspace = true
# Starting them: a process group on Unix, a job object on Windows, no console window (Apache-2.0 OR MIT). Its
# `kill-on-drop` feature is for Tokio only; src/process.rs has its own guard.
process-wrap = { workspace = true, features = ["std", "process-group", "job-object", "creation-flags"] }
# The private temporary folders (MIT OR Apache-2.0).
tempfile.workspace = true
# The answer's validation, without its HTTP resolvers (MIT).
jsonschema.workspace = true
# The picture's JPEG ((MIT OR Apache-2.0) AND IJG, docs/14).
jpeg-encoder.workspace = true
base64.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

# The test doubles (src/fakes.rs, src/bin/ym-fake-*.rs) decode the picture they are given to check it is a JPEG and to
# compute an answer from it. Nothing in the library uses it. MIT OR Apache-2.0 OR Zlib; also a dev-dependency of
# ym-export and ym-color.
zune-jpeg = "0.5"

[target.'cfg(windows)'.dependencies]
# The `CREATE_NO_WINDOW` flag type that process-wrap's `CreationFlags` takes (MIT OR Apache-2.0; already in the lock
# through process-wrap and Tauri).
windows = { version = "0.62", default-features = false, features = ["Win32_System_Threading"] }

[dev-dependencies]
# Turns `test-support` on for this crate's own integration tests, so a plain `cargo test -p ym-agents` runs them.
ym-agents = { workspace = true, features = ["test-support"] }
