[package]
name = "ym-agents"
description = "Auto providers that run the person's own Claude Code (claude) and Antigravity (agy) programs (docs/22)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[features]
# Helpers for the tests of other crates (`ym_agents::testing`): where the two test doubles are. Not part of any shipped build.
test-support = []

[dependencies]
ym-core.workspace = true
# Finding the programs: PATH and PATHEXT (MIT).
which.workspace = true
# Starting them: a process group on Unix, a job object on Windows, kill on drop, no console window (Apache-2.0 OR MIT).
process-wrap = { workspace = true, features = ["std", "process-group", "job-object", "kill-on-drop", "creation-flags"] }
# The private temporary folders (MIT OR Apache-2.0).
tempfile.workspace = true
# The answer's validation, without its HTTP resolvers (MIT).
jsonschema.workspace = true
# The picture's JPEG ((MIT OR Apache-2.0) AND IJG, docs/14).
jpeg-encoder.workspace = true
base64.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
# Decodes the picture's JPEG, as ym-export's tests do.
zune-jpeg = "0.5"
