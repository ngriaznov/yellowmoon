[package]
name = "ym-core"
description = "Yellowmoon core: session, settings, automatic development, render graph, scheduler and export queue."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[dependencies]
ym-raw.workspace = true
ym-profiles.workspace = true
ym-color.workspace = true
ym-gpu.workspace = true
ym-noise.workspace = true
ym-ml.workspace = true
ym-looks.workspace = true
ym-export.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
# The unit of the decoder's quantisation-step plane (read for the clip mask and the noise estimate).
half.workspace = true
# Parallel metadata probes when files are opened, and the 1/8 preview binning.
rayon.workspace = true
tracing.workspace = true
# PNG bytes of the thumbnails and look tiles (MIT OR Apache-2.0, already in the workspace).
png.workspace = true
# The short digest of Apple Auto's instructions in reports and `ym:AppleAuto` (`docs/19` section 7;
# MIT OR Apache-2.0, already in the workspace).
sha2.workspace = true

[features]
# TEST-ONLY. Lets the environment variable `YM_FORCE_DEMOSAIC=<method name>` choose the R6 demosaic
# method of the full-resolution render (`pipeline::forced_demosaic`), so that tests can start the
# `ym` binary with another method and compare it with the app's path
# (`docs/algorithms/01-adaptive-ratio-demosaic.md` section 10). Off by default and never enabled by a
# build of the app or of `ym` that ships: only by the dev-dependencies of `ym-cli` and by an explicit
# `cargo build -p ym-cli --features force-demosaic` for the separately built parity binary. Without
# the feature no code reads the variable.
force-demosaic = []
# TEST-ONLY. Turns on `ym-gpu`'s fault injection (`Gpu::set_fault`, `YM_GPU_FAULT`: an allocation that
# runs out of budget, a shader that does not compile, a lost device, a cancel, a failing tile), so that
# `tests/render_gpu.rs` can show that a device error ends in the CPU render and never in a wrong
# picture. Off by default and never enabled by a shipped build.
fault-injection = ["ym-gpu/fault-injection"]

[dev-dependencies]
tempfile.workspace = true
# Captures what the code logs, to check that no file path reaches the log at info level and above
# (MIT, already in the workspace).
tracing-subscriber.workspace = true
# The synthetic ARW writer (`ym_raw::testgen`) behind the session and estimate tests.
ym-raw = { workspace = true, features = ["testgen"] }
# JSON Schema validation of settings documents against `schema/settings.schema.json` (MIT; default
# features, which resolve references over HTTP and from files, are off, as in ym-profiles).
jsonschema = { version = "0.58", default-features = false }
# Decodes the embedded JPEG previews of real files for the auto-exposure comparison in
# tests/real_files.rs (MIT OR Apache-2.0 OR Zlib; the same version as ym-color's dev-dependency).
zune-jpeg = "0.5"
