[package]
name = "ym-gpu"
description = "GPU device ownership, tiling, buffer pools and WGSL kernels, with CPU reference implementations."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[dependencies]
ym-color.workspace = true
thiserror.workspace = true
rayon.workspace = true
wgpu.workspace = true
pollster.workspace = true
bytemuck.workspace = true
half.workspace = true
tracing.workspace = true

[dev-dependencies]
png.workspace = true
tiff.workspace = true
serde_json.workspace = true
# Offline WGSL validation and translation to MSL and SPIR-V (no GPU needed); MIT OR Apache-2.0, already in the tree via wgpu.
naga = { version = "30", features = ["wgsl-in", "msl-out", "spv-out"] }

# Plain-main benchmarks (no external harness): `cargo bench -p ym-gpu --bench cpu_stages`.
[[bench]]
name = "cpu_stages"
harness = false

[[bench]]
name = "cpu_demosaic"
harness = false
