[package]
name = "ym-gpu"
description = "GPU device ownership, tiling, buffer pools and WGSL kernels, with CPU reference implementations."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[dependencies]
ym-color.workspace = true
# `NoiseDn::from_model` converts the noise model of the sigma map (`cpu::noise`, RA-02). ym-noise
# does not depend on this crate.
ym-noise.workspace = true
thiserror.workspace = true
rayon.workspace = true
wgpu.workspace = true
pollster.workspace = true
bytemuck.workspace = true
half.workspace = true
tracing.workspace = true
# Full-precision `erf` for the pixel-integrated Gaussian kernels of output sharpening
# (`cpu::output_sharpen`, spec 04 section 2.3: "any libm erf, or the libm crate"). MIT, a port of
# the FreeBSD msun routines; already in the shipped tree through naga (wgpu), so no new licence.
libm = "0.2"

[features]
# Off by default, so no normal build changes. `ml` makes the device request exactly what cubecl (burn's
# wgpu backend) requests from an adapter, so the device can be imported into burn (`docs/gpu-plan.md`
# section 8): every adapter feature except `MAPPABLE_PRIMARY_BUFFERS`, the adapter's limits, no experimental
# opt-in. The `ml-backends` CI job turns it on; the application never does.
ml = []
# Fault injection for the fallback tests (`GpuFault`, `YM_GPU_FAULT`): out of budget, a bad shader, a lost
# device, a cancel and a failing tile at a chosen job. Compiled out of every normal build.
fault-injection = []

[dev-dependencies]
png.workspace = true
tiff.workspace = true
serde_json.workspace = true
# Offline WGSL validation and translation to MSL (Metal), SPIR-V (Vulkan) and HLSL (DirectX 12) (no GPU
# needed); MIT OR Apache-2.0, already in the tree via wgpu. `hlsl-out` adds no dependency (a feature of naga
# itself); it is the only offline check of the DX12 path (`docs/gpu-plan.md` N-9).
naga = { version = "30", features = ["wgsl-in", "msl-out", "spv-out", "hlsl-out"] }

# Plain-main benchmarks (no external harness): `cargo bench -p ym-gpu --bench cpu_stages`.
[[bench]]
name = "cpu_stages"
harness = false

[[bench]]
name = "cpu_demosaic"
harness = false
