[package]
name = "golden"
description = "Golden-image tooling: the render-and-compare runner (`check`, `update`), the end-to-end colour truth report (`truth`) and the synthetic ARW writer (`synth`)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[lib]
name = "golden"
path = "src/lib.rs"

[[bin]]
name = "golden"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
hex.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
# The runner reads the 16-bit PNGs `ym render` writes and compares them with CIEDE2000 (ym-color's `deltae`).
png.workspace = true
ym-color.workspace = true
# Test tooling, never shipped: the synthetic ARW writer lives behind this feature.
ym-raw = { workspace = true, features = ["testgen"] }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
# Writes DNG files with known pixels for the DNG reader of `truth`.
ym-export.workspace = true
