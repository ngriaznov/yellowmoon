[package]
name = "golden"
description = "Golden-image tooling: writes the synthetic ARW set from training/synth scenes (`synth`); the render and compare runner is a stub."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
authors.workspace = true
publish = false

[lib]
name = "golden"
path = "src/lib.rs"

[[bin]]
name = "golden"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
hex.workspace = true
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
# Test tooling, never shipped: the synthetic ARW writer lives behind this feature.
ym-raw = { workspace = true, features = ["testgen"] }

[dev-dependencies]
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
